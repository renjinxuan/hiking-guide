/* ================================================================
   导航栈
================================================================ */
/* ================================================================
   导航栈 + 浏览器返回（移动端逐级退，不再一次退到底）
   每个「页面」与「弹层」都对应一条 history 记录：
   手机返回键 / 侧滑 → popstate → 只关最上面那一层。
================================================================ */
const LAYERS = [];              // [{el, close}]，栈顶在最后
let HIST_MODE = 'state';        // pushState 被拦（部分 file:// 环境）时降级为 hash
let backTimer = null;

function histPush(){
  if(HIST_MODE === 'state'){
    try{ history.pushState({d: LAYERS.length}, ''); return; }
    catch(e){ HIST_MODE = 'hash'; }
  }
  try{ location.hash = 'l' + LAYERS.length; }catch(e){}
}
function histReplace(){
  const d = LAYERS.length;
  if(HIST_MODE === 'state'){
    try{ history.replaceState({d}, ''); return; }
    catch(e){ HIST_MODE = 'hash'; }
  }
  try{ history.replaceState(null, '', '#l' + d); }
  catch(e){ try{ location.replace('#l' + d); }catch(_){} }
}
function depthOf(e){
  if(e && e.state && typeof e.state.d === 'number') return e.state.d;
  const m = /^#l(\d+)$/.exec(location.hash || '');
  return m ? parseInt(m[1], 10) : 0;
}
function flushToDepth(d){
  while(LAYERS.length > d){
    const l = LAYERS.pop();
    try{ if(l && l.close) l.close(); }catch(err){ console.warn(err); }
  }
}
function layerPush(layer){
  LAYERS.push(layer);
  histPush();
  return layer;
}
function layerTop(){ return LAYERS[LAYERS.length-1]; }
/* UI 上的「返回 / 关闭」统一走这里：交给浏览器回退，由 popstate 真正出栈 */
function goBack(n){
  if(!LAYERS.length) return false;
  n = Math.min(Math.max(1, n || 1), LAYERS.length);
  const target = LAYERS.length - n;
  let ok = true;
  try{ history.go(-n); }catch(e){ ok = false; }
  clearTimeout(backTimer);
  /* 兜底：个别 WebView 不回抛 popstate，超时后强制出栈 */
  backTimer = setTimeout(()=>{ if(LAYERS.length > target) flushToDepth(target); }, 380);
  if(!ok) flushToDepth(target);
  return true;
}
/* 程序流程里「先关掉某层、紧接着打开别的界面」用它：不出栈，只把当前记录深度改小 */
function layerSilentClose(el){
  const i = LAYERS.findIndex(l=>l.el === el);
  if(i < 0) return false;
  const removed = LAYERS.splice(i).reverse();
  removed.forEach(l=>{ try{ if(l.close) l.close(); }catch(e){} });
  histReplace();
  return true;
}
window.addEventListener('popstate', e=>{
  clearTimeout(backTimer);
  flushToDepth(depthOf(e));
});
window.addEventListener('hashchange', ()=>{
  if(HIST_MODE !== 'hash') return;
  clearTimeout(backTimer);
  flushToDepth(depthOf(null));
});
try{ history.replaceState({d:0}, ''); }catch(e){ HIST_MODE = 'hash'; }

function pushPage(page){
  const prev = navStack[navStack.length-1] || document.getElementById('page-main');
  if(prev){ prev.classList.add('behind-left'); }
  page.style.position='absolute'; page.style.inset='0'; page.style.zIndex = 45 + navStack.length;
  page.style.transform='translateX(100%)';
  screen.appendChild(page);
  navStack.push(page);
  layerPush({el:page, close:()=>closePageNode(page)});
  requestAnimationFrame(()=>requestAnimationFrame(()=>{ page.style.transform='translateX(0)'; }));
}
function closePageNode(page){
  if(!page) return;
  const i = navStack.indexOf(page);
  if(i >= 0) navStack.splice(i, 1);
  const prev = navStack[navStack.length-1] || document.getElementById('page-main');
  if(prev) prev.classList.remove('behind-left');
  page.style.transform='translateX(100%)';
  setTimeout(()=>{ if(page.parentNode) page.remove(); }, 420);
}
function replacePage(page){
  const cur = navStack[navStack.length-1];
  page.style.position='absolute'; page.style.inset='0'; page.style.zIndex = 45 + Math.max(0, navStack.length-1);
  page.style.transform='translateX(100%)';
  screen.appendChild(page);
  if(cur){
    cur.style.transition='transform .3s,opacity .3s';
    cur.style.opacity='0';
    cur.style.transform='translateX(-18%)';
    setTimeout(()=>{ if(cur.parentNode) cur.remove(); }, 320);
    navStack.pop();
  }
  navStack.push(page);
  /* 同一层记录改成指向新页面，返回时仍然只退一层 */
  const top = LAYERS[LAYERS.length-1];
  if(top){ top.el = page; top.close = ()=>closePageNode(page); }
  else { layerPush({el:page, close:()=>closePageNode(page)}); }
  requestAnimationFrame(()=>requestAnimationFrame(()=>{ page.style.transform='translateX(0)'; }));
}
function popPage(){
  /* 旧的直接调用入口：统一改成让浏览器退一步 */
  return goBack(1);
}

/* ================================================================
   照片全屏缩放：双指捏合 / 双击放大 / 放大后拖动平移
================================================================ */
function openZoom(src, caption){
  if(!src) return;
  if(document.getElementById('zoom-layer')) return;
  const z = el(`<div class="zoom-layer" id="zoom-layer">
    <div class="zoom-stage"><img class="zoom-img" id="zoom-img" src="${src}" draggable="false" alt=""></div>
    <div class="zoom-top">
      <button class="zoom-x" id="zoom-x">关闭</button>
      <div class="zoom-cap">${caption||''}</div>
    </div>
    <div class="zoom-hint" id="zoom-hint">双指放大 · 双击放大 · 拖动查看</div>
    <div class="zoom-scale" id="zoom-scale">1.0×</div>
  </div>`);
  screen.appendChild(z);
  const img = z.querySelector('#zoom-img');
  const hint = z.querySelector('#zoom-hint');
  const badge = z.querySelector('#zoom-scale');
  const MAXS = 4;
  let s = 1, tx = 0, ty = 0;
  let start = null, lastTap = 0, mdown = null, gestureUsed = false;

  const box = ()=>{ const r = z.getBoundingClientRect(); return {w:r.width || 1, h:r.height || 1}; };
  const rel = (x, y)=>{ const r = z.getBoundingClientRect(); return {x:x-r.left, y:y-r.top}; };
  const dist = (a, b)=>Math.hypot(a.clientX-b.clientX, a.clientY-b.clientY);
  const relMid = (a, b)=>rel((a.clientX+b.clientX)/2, (a.clientY+b.clientY)/2);

  const apply = (animate)=>{
    img.classList.toggle('dragging', !animate);
    img.style.transform = `translate3d(${tx}px,${ty}px,0) scale(${s})`;
    badge.textContent = s.toFixed(1)+'×';
    badge.classList.toggle('on', s > 1.02);
    hint.style.opacity = s > 1.02 ? '0' : '1';
  };
  const clampT = ()=>{
    const b = box();
    const iw = img.offsetWidth || b.w, ih = img.offsetHeight || b.h;
    const mx = Math.max(0, (iw*s - b.w)/2);
    const my = Math.max(0, (ih*s - b.h)/2);
    tx = Math.max(-mx, Math.min(mx, tx));
    ty = Math.max(-my, Math.min(my, ty));
  };
  /* 以 base 变换为起点，把 A0 处的画面钉在 A 处并缩放到 ns */
  const zoomFrom = (base, A0, A, ns)=>{
    const b = box(), cx = b.w/2, cy = b.h/2;
    const ax = (A0.x - cx - base.tx)/base.s;
    const ay = (A0.y - cy - base.ty)/base.s;
    s = Math.max(1, Math.min(MAXS, ns));
    if(s <= 1.001){ s = 1; tx = 0; ty = 0; }
    else {
      tx = A.x - cx - ax*s;
      ty = A.y - cy - ay*s;
      clampT();
    }
    apply(false);
  };

  z.addEventListener('touchstart', e=>{
    if(e.touches.length === 2){
      const a = e.touches[0], b = e.touches[1];
      start = {mode:'pinch', d:Math.max(1, dist(a,b)), base:{s,tx,ty}, m:relMid(a,b)};
      img.classList.add('dragging');
    } else if(e.touches.length === 1){
      const p = rel(e.touches[0].clientX, e.touches[0].clientY);
      start = {mode:'single', x:p.x, y:p.y, base:{s,tx,ty}, moved:false};
      img.classList.add('dragging');
    }
  }, {passive:false});

  z.addEventListener('touchmove', e=>{
    if(!start) return;
    if(e.touches.length === 2){
      if(start.mode !== 'pinch'){
        const a0 = e.touches[0], b0 = e.touches[1];
        start = {mode:'pinch', d:Math.max(1, dist(a0,b0)), base:{s,tx,ty}, m:relMid(a0,b0)};
      }
      e.preventDefault();
      gestureUsed = true;
      const a = e.touches[0], b = e.touches[1];
      zoomFrom(start.base, start.m, relMid(a,b), start.base.s * (dist(a,b)/start.d));
      return;
    }
    if(start.mode === 'single'){
      const p = rel(e.touches[0].clientX, e.touches[0].clientY);
      const dx = p.x - start.x, dy = p.y - start.y;
      if(Math.abs(dx) + Math.abs(dy) > 6) { start.moved = true; gestureUsed = true; }
      if(start.base.s > 1.02){
        e.preventDefault();
        s = start.base.s;
        tx = start.base.tx + dx;
        ty = start.base.ty + dy;
        clampT(); apply(false);
      }
    }
  }, {passive:false});

  z.addEventListener('touchend', e=>{
    if(!start) return;
    if(start.mode === 'single' && !start.moved && e.touches.length === 0){
      const now = Date.now();
      if(now - lastTap < 320){
        lastTap = 0;
        const A = {x:start.x, y:start.y};
        zoomFrom({s,tx,ty}, A, A, s > 1.2 ? 1 : 2.4);
      } else { lastTap = now; }
    }
    if(e.touches.length === 0){
      start = null;
      if(s < 1.02){ s = 1; tx = 0; ty = 0; }
      clampT(); apply(true);
    }
  });

  /* 桌面演示：滚轮缩放 / 拖拽 / 双击 */
  z.addEventListener('wheel', e=>{
    e.preventDefault();
    const A = rel(e.clientX, e.clientY);
    zoomFrom({s,tx,ty}, A, A, s * (e.deltaY > 0 ? 0.88 : 1.14));
  }, {passive:false});
  z.addEventListener('mousedown', e=>{
    if(e.button !== 0) return;
    const p = rel(e.clientX, e.clientY);
    mdown = {x:p.x, y:p.y, base:{s,tx,ty}};
    img.classList.add('dragging');
  });
  z.addEventListener('mousemove', e=>{
    if(!mdown || mdown.base.s <= 1.02) return;
    const p = rel(e.clientX, e.clientY);
    s = mdown.base.s;
    tx = mdown.base.tx + (p.x - mdown.x);
    ty = mdown.base.ty + (p.y - mdown.y);
    clampT(); apply(false);
  });
  z.addEventListener('mouseup', ()=>{ mdown = null; apply(true); });
  z.addEventListener('mouseleave', ()=>{ mdown = null; apply(true); });
  z.addEventListener('dblclick', e=>{
    const A = rel(e.clientX, e.clientY);
    zoomFrom({s,tx,ty}, A, A, s > 1.2 ? 1 : 2.4);
  });
  z.addEventListener('click', e=>{
    /* 捏合 / 拖动之后浏览器可能补一个 click，别把放大层顺手关掉 */
    if(gestureUsed){ gestureUsed = false; return; }
    if(e.target === z || e.target.classList.contains('zoom-stage')) closeMask(z);
  });

  z.querySelector('#zoom-x').onclick = ()=>closeMask(z);
  layerPush({el:z, close:()=>{
    z.classList.remove('show');
    setTimeout(()=>{ if(z.parentNode) z.remove(); }, 220);
  }});
  const onKey = e=>{ if((e.key === 'Escape' || e.key === 'Backspace') && document.getElementById('zoom-layer')) closeMask(z); };
  document.addEventListener('keydown', onKey);
  const mo = new MutationObserver(()=>{ if(!z.isConnected){ document.removeEventListener('keydown', onKey); mo.disconnect(); } });
  mo.observe(screen, {childList:true});
  requestAnimationFrame(()=>requestAnimationFrame(()=>z.classList.add('show')));
}
