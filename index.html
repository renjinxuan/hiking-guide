<!DOCTYPE html>

<title data-page-node-id="IV5tfAIagU69xuSsz22TRN" data-pnid-children="0K6bKpRcRWsf2fu2vMM5Mh">徒步图鉴 · 交互原型</title>
<style data-page-node-id="2hL3IBtINETEQjaLBR4dRw" data-pnid-children="pkDIG5B71TgGI1RmJzd7kV">
:root{
  --bg:#F7F8F5; --card:#FFFFFF; --ink:#16301F; --ink2:#3D4A41;
  --gray:#86928B; --gray2:#A8B2AC;
  --green:#22A06B; --green2:#1D9E75; --deep:#0F6E56;
  --cardgreen1:#1E5C41; --cardgreen2:#2E7D5B;
  --gold:#B8860B; --gold2:#D8A95A;
  --line:#E7E5DE; --shadow:0 8px 28px rgba(22,48,31,.10);
}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;user-select:none}
html,body{height:100%}
body{
  font-family:-apple-system,"PingFang SC","Helvetica Neue","Microsoft YaHei",sans-serif;
  background:#EDECE6; color:var(--ink);
  display:flex; align-items:center; justify-content:center; overflow:hidden;
}
.stage{display:flex;flex-direction:column;align-items:center;gap:14px}
.caption{font-size:12px;color:#9aa39d;letter-spacing:.12em}
.caption b{color:#6f7a73;letter-spacing:.05em}

/* ============ 手机框 ============ */
.phone{
  width:390px;height:844px;background:var(--bg);border-radius:52px;position:relative;
  box-shadow:0 24px 70px rgba(22,48,31,.28),0 0 0 10px #1c1f1d,0 0 0 12px #3a3f3b;
  overflow:hidden;
}
.screen{position:absolute;inset:0;overflow:hidden}
.statusbar{
  position:absolute;top:0;left:0;right:0;height:52px;z-index:50;
  display:flex;align-items:flex-end;justify-content:space-between;
  padding:0 26px 6px;pointer-events:none;
}
.statusbar .time{font-size:15px;font-weight:600;letter-spacing:.02em;color:var(--ink)}
.statusbar .icons{display:flex;align-items:center;gap:5px}
.sb-i{display:inline-block}
.page{
  position:absolute;inset:0;background:var(--bg);display:flex;flex-direction:column;
  transition:transform .38s cubic-bezier(.32,.72,.24,1),opacity .38s;
}
.page.off-left{transform:translateX(-100%)}
.page.off-right{transform:translateX(100%)}
.page.behind-left{transform:translateX(-26%) scale(.96);opacity:.6}
.page.hidden{display:none}

/* ============ 通用 ============ */
.btn-green{
  background:linear-gradient(135deg,#2AAE74,#1D9E75);color:#fff;border:none;cursor:pointer;
  border-radius:16px;font-size:17px;font-weight:600;letter-spacing:.02em;
  box-shadow:0 10px 22px rgba(29,158,117,.32);transition:transform .12s, box-shadow .12s;
  display:flex;align-items:center;justify-content:center;gap:8px;font-family:inherit;
}
.btn-green:active{transform:scale(.965);box-shadow:0 4px 10px rgba(29,158,117,.3)}
.btn-ghost{
  background:transparent;border:1.5px solid var(--line);color:var(--ink2);border-radius:14px;
  font-size:15px;font-weight:500;cursor:pointer;font-family:inherit;
  display:flex;align-items:center;justify-content:center;gap:6px;transition:transform .12s;
}
.btn-ghost:active{transform:scale(.96)}
.chip{
  display:inline-flex;align-items:center;gap:4px;font-size:11px;padding:3px 8px;border-radius:8px;
  background:#F1F3EE;color:var(--ink2);font-weight:500;
}
.chip.green{background:#E3F2EA;color:var(--deep)}
.chip.gold{background:#F8EFDB;color:var(--gold)}
.back-btn{
  width:36px;height:36px;border-radius:50%;background:#fff;border:1px solid var(--line);
  display:flex;align-items:center;justify-content:center;cursor:pointer;flex:none;
  box-shadow:0 2px 8px rgba(22,48,31,.06);transition:transform .12s;
}
.back-btn:active{transform:scale(.9)}

/* ============ 开屏 / 登录 ============ */
#page-splash{background:var(--bg);padding:0 26px;display:flex;flex-direction:column;z-index:40}
.splash-top{display:flex;align-items:center;gap:12px;margin-top:78px}
.logo-badge{
  width:52px;height:52px;border-radius:15px;background:linear-gradient(140deg,#2AAE74,#178A5C);
  display:flex;align-items:center;justify-content:center;box-shadow:0 8px 18px rgba(34,160,107,.35);
}
.brand-name{font-size:21px;font-weight:700;letter-spacing:.06em;line-height:1.15}
.brand-en{font-size:10px;letter-spacing:.34em;color:var(--gray);font-weight:600}
.splash-mid{margin-top:44px;flex:1;display:flex;flex-direction:column}
.eyebrow{display:flex;align-items:center;gap:9px;color:var(--green2);font-size:14px;font-weight:600;letter-spacing:.04em}
.eyebrow::before{content:"";width:22px;height:3px;border-radius:2px;background:var(--green2)}
.splash-title{font-size:41px;font-weight:800;line-height:1.24;letter-spacing:.01em;margin-top:16px}
.splash-sub{color:var(--gray);font-size:15px;margin-top:12px;letter-spacing:.02em}
.splash-art{margin-top:auto;height:330px;position:relative}
.splash-art svg{width:100%;height:100%}
.art-cloud{position:absolute;border-radius:50%;background:#fff;opacity:.7;filter:blur(1px)}
.splash-bottom{padding:18px 0 30px}
.btn-wechat{height:56px;font-size:17px;border-radius:18px;width:100%}
.btn-wechat .wx{width:26px;height:26px}
.guest-link{
  text-align:center;margin-top:16px;font-size:14.5px;color:var(--ink2);cursor:pointer;
  display:flex;align-items:center;justify-content:center;gap:5px;font-weight:500;
}
.guest-link .arr{transition:transform .2s}
.guest-link:hover .arr{transform:translateX(4px)}
.legal{text-align:center;margin-top:14px;font-size:11px;color:var(--gray2)}
.legal span{color:var(--green2)}
.fade-up{opacity:0;transform:translateY(22px);animation:fadeUp .7s cubic-bezier(.2,.7,.3,1) forwards}
@keyframes fadeUp{to{opacity:1;transform:none}}
@keyframes floatY{0%,100%{transform:translateY(0)}50%{transform:translateY(-8px)}}

/* ============ 主框架 / TabBar ============ */
.tabbar{
  position:absolute;bottom:0;left:0;right:0;height:86px;z-index:30;
  background:rgba(255,255,255,.92);backdrop-filter:blur(14px);
  border-top:1px solid var(--line);
  display:flex;align-items:flex-start;justify-content:space-around;padding-top:10px;
}
.tab-item{display:flex;flex-direction:column;align-items:center;gap:3px;width:84px;cursor:pointer;color:var(--gray2);transition:color .2s}
.tab-item .t-label{font-size:11.5px;font-weight:500}
.tab-item.active{color:var(--deep)}
.tab-item.center{width:76px}
.tab-fab{
  width:60px;height:60px;border-radius:50%;margin-top:-32px;
  background:linear-gradient(140deg,#2AAE74,#178A5C);
  display:flex;align-items:center;justify-content:center;cursor:pointer;
  box-shadow:0 10px 22px rgba(29,158,117,.4),0 0 0 6px var(--bg);
  transition:transform .15s;
}
.tab-fab:active{transform:scale(.9)}
.tabbar .home-indicator{position:absolute;bottom:7px;left:50%;transform:translateX(-50%);width:120px;height:4px;border-radius:2px;background:#1c1f1d;opacity:.85}
.page-body{flex:1;overflow-y:auto;overscroll-behavior:contain;padding-bottom:110px;scrollbar-width:none}
.page-body::-webkit-scrollbar{display:none}

/* ============ 路线页 ============ */
.route-header{padding:64px 22px 6px;display:flex;align-items:center;justify-content:space-between}
.route-header h1{font-size:30px;font-weight:800;letter-spacing:.02em}
.map-mode-btn{
  display:flex;align-items:center;gap:5px;border:1.5px solid var(--green2);color:var(--deep);
  background:#fff;border-radius:999px;padding:7px 13px;font-size:13px;font-weight:600;cursor:pointer;font-family:inherit;
}
.search-row{display:flex;gap:10px;padding:10px 22px 4px}
.search-box{
  flex:1;height:46px;background:#fff;border:1px solid var(--line);border-radius:14px;
  display:flex;align-items:center;gap:8px;padding:0 14px;color:var(--gray2);font-size:14px;cursor:pointer;
}
.plus-btn{
  width:46px;height:46px;border-radius:14px;border:none;cursor:pointer;
  background:linear-gradient(140deg,#2AAE74,#178A5C);color:#fff;
  display:flex;align-items:center;justify-content:center;box-shadow:0 6px 14px rgba(29,158,117,.3);
  transition:transform .12s;font-family:inherit;
}
.plus-btn:active{transform:scale(.9)}
.banner-row{display:flex;gap:10px;padding:14px 22px 4px}
.banner-card{
  flex:1;min-width:0;height:118px;border-radius:18px;position:relative;overflow:hidden;cursor:pointer;
  color:#fff;transition:transform .15s;
}
.banner-card:active{transform:scale(.965)}
.banner-card svg{position:absolute;inset:0;width:100%;height:100%}
.banner-inner{position:relative;z-index:2;padding:14px 15px;height:100%;display:flex;flex-direction:column}
.banner-tag{align-self:flex-start;font-size:10px;background:rgba(255,255,255,.22);backdrop-filter:blur(3px);padding:3px 8px;border-radius:7px;font-weight:600;letter-spacing:.05em}
.banner-title{font-size:16.5px;font-weight:700;line-height:1.35;margin-top:9px;text-shadow:0 1px 6px rgba(0,0,0,.2)}
.banner-sub{font-size:10.5px;opacity:.85;margin-top:auto}
.route-tabs{display:flex;gap:20px;padding:16px 22px 8px;font-size:15px;color:var(--gray)}
.route-tabs .rt{cursor:pointer;position:relative;padding-bottom:7px;font-weight:500;transition:color .2s}
.route-tabs .rt.active{color:var(--ink);font-weight:700}
.route-tabs .rt.active::after{content:"";position:absolute;left:50%;transform:translateX(-50%);bottom:0;width:22px;height:3.5px;border-radius:2px;background:var(--green2)}
.route-item{
  margin:10px 22px 0;background:#fff;border:1px solid var(--line);border-radius:18px;padding:13px;
  display:flex;gap:13px;cursor:pointer;transition:transform .15s,box-shadow .15s;
}
.route-item:active{transform:scale(.975)}
.route-thumb{width:96px;height:96px;border-radius:13px;overflow:hidden;flex:none;position:relative}
.route-thumb svg{width:100%;height:100%}
.diff-tag{position:absolute;top:6px;left:6px;font-size:10px;background:rgba(255,255,255,.92);border-radius:6px;padding:2px 7px;font-weight:600;color:var(--deep)}
.route-info{flex:1;min-width:0;display:flex;flex-direction:column}
.route-name{font-size:16px;font-weight:700;letter-spacing:.01em}
.route-meta{display:flex;flex-wrap:wrap;gap:9px;font-size:11.5px;color:var(--gray);margin-top:6px}
.route-meta b{color:var(--ink2);font-weight:600}
.route-hot{font-size:11px;color:var(--gray2);margin-top:4px}
.route-hot-row{display:flex;align-items:center;gap:8px;margin-top:4px}
.route-hot-row .route-hot{margin-top:0;flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
/* 点赞 / 评论 */
.social-bar{display:flex;align-items:center;gap:6px;flex:none}
.soc-btn{
  display:flex;align-items:center;gap:4px;height:24px;padding:0 9px;border-radius:12px;
  border:1px solid var(--line);background:#fff;color:var(--gray);font-family:inherit;
  font-size:11px;font-weight:600;cursor:pointer;transition:all .15s;
}
.soc-btn span{line-height:1}
.soc-btn:active{transform:scale(.94)}
.soc-btn.like.on{border-color:#F0C9C6;background:#FDF2F1;color:#CF453F}
.soc-btn.like.on svg{fill:#CF453F;stroke:#CF453F}
.feed-social{padding:9px 0 0;margin-top:9px;border-top:1px solid #F2F1EC;display:flex}
.feed-social .soc-btn{height:26px;font-size:11.5px}

/* 评论抽屉 */
.sheet-mask{
  position:absolute;inset:0;z-index:70;background:rgba(22,48,31,.34);
  opacity:0;transition:opacity .24s;display:flex;align-items:flex-end;
}
.sheet-mask.show{opacity:1}
.sheet{
  width:100%;max-height:72%;background:#fff;border-radius:22px 22px 0 0;
  transform:translateY(100%);transition:transform .3s cubic-bezier(.32,.72,.24,1);
  display:flex;flex-direction:column;padding-bottom:22px;
}
.sheet-mask.show .sheet{transform:translateY(0)}
.sheet-grip{width:36px;height:4px;border-radius:2px;background:#E2E0D8;margin:9px auto 0;flex:none}
.sheet-head{
  display:flex;align-items:center;padding:12px 18px 10px;flex:none;
  border-bottom:1px solid #F2F1EC;
}
.sheet-head b{font-size:14.5px;font-weight:700}
.sheet-head .n{font-size:11.5px;color:var(--gray);margin-left:6px;font-weight:500}
.sheet-x{
  margin-left:auto;background:none;border:none;font-family:inherit;font-size:12.5px;
  color:var(--gray);cursor:pointer;padding:4px;
}
.sheet-list{flex:1;overflow-y:auto;padding:4px 18px 6px;min-height:120px}
.cmt-item{display:flex;gap:10px;padding:11px 0;border-bottom:1px solid #F7F6F2}
.cmt-item:last-child{border-bottom:none}
.cmt-av{
  width:30px;height:30px;border-radius:50%;flex:none;display:flex;align-items:center;justify-content:center;
  font-size:12px;font-weight:700;color:#fff;background:#7E9C88;
}
.cmt-av.me{background:var(--green2)}
.cmt-main{min-width:0;flex:1}
.cmt-top{display:flex;align-items:baseline;gap:7px}
.cmt-u{font-size:12px;font-weight:700;color:var(--ink2)}
.cmt-t{font-size:10px;color:var(--gray2)}
.cmt-c{font-size:13px;line-height:1.6;color:var(--ink2);margin-top:3px}
.cmt-empty{text-align:center;font-size:12px;color:var(--gray2);padding:38px 0}
.sheet-bar{
  display:flex;align-items:center;gap:9px;padding:10px 18px 0;flex:none;
}
.sheet-bar input{
  flex:1;min-width:0;height:40px;border-radius:20px;border:1.5px solid var(--line);
  background:#F7F8F5;padding:0 15px;font-family:inherit;font-size:13px;color:var(--ink);
  outline:none;user-select:text;
}
.sheet-bar input:focus{border-color:var(--green2);background:#fff}
.sheet-bar button{
  flex:none;height:40px;padding:0 18px;border-radius:20px;border:none;cursor:pointer;
  background:var(--green2);color:#fff;font-family:inherit;font-size:13px;font-weight:700;
}
.sheet-bar button:active{transform:scale(.96)}
.sheet-bar button:disabled{background:#D5DBD7;cursor:default}
/* 详情页互动条 */
.detail-social{
  display:flex;align-items:center;gap:10px;padding:12px 20px 0;
}
.detail-social .soc-btn{height:30px;padding:0 13px;font-size:12px;border-radius:15px}
.detail-social .sec-line{flex:1}
.detail-social-note{font-size:11.5px;color:var(--gray2)}
.route-tags{display:flex;gap:6px;margin-top:auto;padding-top:6px}

/* ============ 路线详情 ============ */
.detail-header{
  padding:58px 16px 10px;display:flex;align-items:center;gap:12px;background:var(--bg);position:relative;z-index:5;
}
.detail-header h2{flex:1;text-align:center;font-size:17px;font-weight:700}
.fav-btn{display:flex;align-items:center;gap:4px;font-size:13px;color:var(--gray);cursor:pointer;background:none;border:none;font-family:inherit}
.map-wrap{position:relative;height:316px;margin:2px 14px 0;border-radius:16px;overflow:hidden;background:#EEF0E8}
.map-wrap svg{width:100%;height:100%;display:block}
.map-legend{
  position:absolute;left:12px;bottom:12px;background:rgba(255,255,255,.94);border-radius:10px;
  padding:7px 11px;font-size:11px;color:var(--ink2);display:flex;gap:12px;box-shadow:0 3px 10px rgba(22,48,31,.1);
}
.legend-dot{width:8px;height:8px;border-radius:50%;display:inline-block;margin-right:5px;vertical-align:0}
.map-marker-label{font-size:11px;font-weight:600;fill:var(--ink2)}
.compass{
  position:absolute;right:12px;top:12px;width:40px;height:40px;border-radius:50%;
  background:rgba(255,255,255,.94);display:flex;align-items:center;justify-content:center;
  box-shadow:0 3px 10px rgba(22,48,31,.12);
}
.stat-row{
  margin:14px 14px 0;background:#fff;border:1px solid var(--line);border-radius:16px;
  display:flex;padding:16px 6px;
}
.stat-cell{flex:1;text-align:center;border-right:1px solid var(--line)}
.stat-cell:last-child{border-right:none}
.stat-v{font-size:21px;font-weight:800;letter-spacing:.01em}
.stat-v small{font-size:12px;font-weight:600;color:var(--ink2)}
.stat-k{font-size:11px;color:var(--gray);margin-top:3px}
.stat-cell .easy{color:var(--green2)}
.sec-title{display:flex;align-items:baseline;justify-content:space-between;padding:20px 20px 4px}
.sec-title h3{font-size:17px;font-weight:800}
.sec-title .more{font-size:12px;color:var(--gray);cursor:pointer}
.photo-strip{display:flex;gap:9px;padding:10px 20px 0;overflow-x:auto;scrollbar-width:none}
.photo-strip::-webkit-scrollbar{display:none}
.strip-item{flex:none;width:118px;height:118px;border-radius:13px;overflow:hidden;position:relative;cursor:pointer;transition:transform .15s}
.strip-item:active{transform:scale(.94)}
.strip-item img{width:100%;height:100%;object-fit:cover}
.ai-badge{
  position:absolute;top:7px;right:7px;background:rgba(22,48,31,.72);color:#fff;backdrop-filter:blur(2px);
  font-size:10px;padding:3px 8px;border-radius:7px;display:flex;align-items:center;gap:3px;font-weight:600;
}
.detail-cta{padding:18px 16px 26px;margin-top:auto}
.detail-cta .btn-green{height:54px;font-size:16.5px}

/* ============ 出发页 ============ */
.depart-header{padding:64px 22px 14px}
.depart-header h1{font-size:30px;font-weight:800}
.depart-header p{color:var(--gray);font-size:14px;margin-top:5px}
.hero-card{
  margin:6px 22px 0;height:196px;border-radius:22px;position:relative;overflow:hidden;cursor:pointer;
  color:#fff;background:linear-gradient(140deg,#1E5C41,#2E7D5B 62%,#37876A);
  box-shadow:0 14px 30px rgba(30,92,65,.35);transition:transform .16s;
}
.hero-card:active{transform:scale(.975)}
.hero-card svg.bgart{position:absolute;inset:0;width:100%;height:100%}
.hero-inner{position:relative;z-index:2;padding:22px;height:100%;display:flex;flex-direction:column}
.hero-icon{
  width:52px;height:52px;border-radius:15px;background:rgba(255,255,255,.16);backdrop-filter:blur(3px);
  display:flex;align-items:center;justify-content:center;border:1px solid rgba(255,255,255,.3);
}
.hero-title{font-size:23px;font-weight:800;margin-top:14px;letter-spacing:.02em}
.hero-sub{font-size:13px;opacity:.88;margin-top:5px}
.hero-arrow{
  position:absolute;right:18px;bottom:18px;width:42px;height:42px;border-radius:50%;background:#fff;
  display:flex;align-items:center;justify-content:center;box-shadow:0 6px 14px rgba(0,0,0,.18);
  transition:transform .2s;
}
.hero-card:hover .hero-arrow{transform:translateX(5px)}
.entry-row{display:flex;gap:12px;margin:14px 22px 0}
.entry-card{
  flex:1;background:#fff;border:1px solid var(--line);border-radius:18px;padding:16px 15px;cursor:pointer;
  transition:transform .15s, box-shadow .15s;
}
.entry-card:active{transform:scale(.96)}
.entry-icon{width:38px;height:38px;border-radius:12px;background:#EAF4EE;color:var(--deep);display:flex;align-items:center;justify-content:center}
.entry-title{font-size:15.5px;font-weight:700;margin-top:11px}
.entry-sub{font-size:11.5px;color:var(--gray);margin-top:4px;line-height:1.5}
.recent-item{
  margin:0 22px;padding:13px 2px;display:flex;align-items:center;gap:12px;cursor:pointer;
  border-bottom:1px solid var(--line);
}
.recent-item:last-child{border-bottom:none}
.recent-thumb{width:46px;height:46px;border-radius:11px;overflow:hidden;flex:none}
.recent-thumb img{width:100%;height:100%;object-fit:cover}
.recent-info{flex:1;min-width:0}
.recent-name{font-size:14.5px;font-weight:600}
.recent-meta{font-size:11.5px;color:var(--gray);margin-top:3px}
.recent-arrow{color:var(--gray2)}
.empty-recent{padding:22px;text-align:center;color:var(--gray2);font-size:13px}

/* ============ 我的照片 · 相册 ============ */
.gp-wrap{padding-bottom:34px}
.gp-sum{padding:2px 20px 0;font-size:12.5px;color:var(--gray);display:flex;align-items:baseline;gap:5px}
.gp-sum b{font-size:17px;color:var(--ink);font-weight:800}
.gp-tabs{display:flex;gap:8px;padding:13px 20px 2px;overflow-x:auto;scrollbar-width:none}
.gp-tabs::-webkit-scrollbar{display:none}
.gp-tab{flex:none;font-size:12.5px;padding:6px 13px;border-radius:20px;background:#fff;
  border:1px solid var(--line);color:var(--ink2);cursor:pointer;transition:all .16s}
.gp-tab.on{background:var(--deep);border-color:var(--deep);color:#fff;font-weight:600}
.gp-grid{columns:2;column-gap:9px;padding:12px 20px 0}
.gp-item{break-inside:avoid;margin-bottom:9px;border-radius:13px;overflow:hidden;background:#fff;
  border:1px solid var(--line);cursor:pointer;transition:transform .16s;box-shadow:0 2px 10px rgba(22,48,31,.05)}
.gp-item:active{transform:scale(.975)}
.gp-item img{width:100%;display:block;background:#EAEAE2}
.gp-cap{padding:8px 10px 9px;display:flex;align-items:center;gap:6px}
.gp-name{font-size:12px;font-weight:700;color:var(--ink);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.gp-tag{flex:none;font-size:9px;padding:1.5px 5px;border-radius:4px;background:#EAF5EF;color:var(--deep);letter-spacing:.02em}
.gp-date{font-size:9.5px;color:var(--gray2);margin-left:auto;flex:none;letter-spacing:.02em}

/* ============ 照片详情 ============ */
.pd-hero{margin:6px 14px 0;border-radius:16px;overflow:hidden;background:#0E1A13}
.pd-hero img{width:100%;display:block}
.pd-card{margin:14px 14px 0;background:#fff;border:1px solid var(--line);border-radius:16px;padding:16px 16px 14px}
.pd-name{font-size:20px;font-weight:800;letter-spacing:.01em}
.pd-en{font-size:9.5px;letter-spacing:.2em;color:var(--gray);margin-top:5px}
.pd-rows{margin-top:13px;border-top:1px solid var(--line);padding-top:12px;display:flex;flex-direction:column;gap:9px}
.pd-row{display:flex;font-size:12.5px;line-height:1.5}
.pd-row .k{color:var(--gray);width:62px;flex:none}
.pd-row .v{color:var(--ink2);flex:1}
.pd-acts{display:flex;gap:10px;margin:16px 14px 0}
.pd-acts button{flex:1;height:48px;font-size:14.5px}

/* ============ 选照片 ============ */
.picker-grid{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;padding:12px 20px}
.picker-item{position:relative;aspect-ratio:1;border-radius:12px;overflow:hidden;cursor:pointer}
.picker-item img{width:100%;height:100%;object-fit:cover}
.picker-check{
  position:absolute;top:7px;right:7px;width:23px;height:23px;border-radius:50%;
  border:2px solid rgba(255,255,255,.95);background:rgba(22,48,31,.25);
  display:flex;align-items:center;justify-content:center;transition:all .18s;
}
.picker-item.on .picker-check{background:var(--green2);border-color:#fff}
.picker-check svg{opacity:0;transform:scale(.4);transition:all .18s}
.picker-item.on .picker-check svg{opacity:1;transform:scale(1)}
.picker-bar{
  position:absolute;bottom:0;left:0;right:0;padding:14px 20px 28px;background:var(--bg);
  border-top:1px solid var(--line);
}
.selected-tip{font-size:13px;color:var(--gray);margin-bottom:10px;display:flex;align-items:center;gap:6px}
.selected-tip b{color:var(--deep)}

/* ============ 选择成图效果 ============ */
.effect-summary{
  margin:10px 20px 0;background:#fff;border:1px solid var(--line);border-radius:14px;
  padding:12px 14px;display:flex;align-items:center;gap:10px;font-size:13.5px;
}
.effect-summary .thumb-mini{width:34px;height:34px;border-radius:9px;overflow:hidden;flex:none}
.effect-summary .thumb-mini img{width:100%;height:100%;object-fit:cover}
.effect-summary .re{margin-left:auto;color:var(--green2);font-size:13px;cursor:pointer;font-weight:600;background:none;border:none;font-family:inherit}
.tpl-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;padding:14px 20px 8px}
.tpl-card{
  background:#fff;border:2px solid var(--line);border-radius:16px;overflow:hidden;cursor:pointer;
  transition:border-color .18s, transform .15s;position:relative;
}
.tpl-card:active{transform:scale(.96)}
.tpl-card.on{border-color:var(--green2);box-shadow:0 6px 18px rgba(29,158,117,.16)}
.tpl-check{
  position:absolute;top:8px;right:8px;width:22px;height:22px;border-radius:50%;background:var(--green2);
  display:flex;align-items:center;justify-content:center;opacity:0;transform:scale(.4);transition:all .2s;z-index:3;
}
.tpl-card.on .tpl-check{opacity:1;transform:scale(1)}
.tpl-preview{height:104px;position:relative;overflow:hidden}
.tpl-preview svg{width:100%;height:100%;display:block}
.tpl-body{padding:10px 12px 12px}
.tpl-name-row{display:flex;align-items:center;justify-content:space-between}
.tpl-name{font-size:14.5px;font-weight:700}
.tpl-tag{font-size:10px;font-weight:600;padding:2px 7px;border-radius:6px}
.tpl-tag.free{background:#E3F2EA;color:var(--deep)}
.tpl-tag.limited{background:#F8EFDB;color:var(--gold)}
.tpl-desc{font-size:11px;color:var(--gray);margin-top:4px}
.effect-note{text-align:center;font-size:11px;color:var(--gray2);padding:10px 30px 0}
.effect-bar{position:absolute;bottom:0;left:0;right:0;padding:12px 20px 28px;background:var(--bg);border-top:1px solid var(--line)}
.effect-bar .btn-green{height:52px;font-size:16.5px}

/* ============ 生图设置（选模型 + 写提示词） ============ */
.pp-sec{padding:18px 20px 0}
.pp-sec-head{display:flex;align-items:baseline;gap:8px;margin-bottom:10px}
.pp-sec-title{font-size:14px;font-weight:700;letter-spacing:.01em}
.pp-sec-hint{font-size:11px;color:var(--gray2)}
.pp-sec-more{margin-left:auto;font-size:11.5px;color:var(--green2);font-weight:600}
/* 当前效果摘要 */
.pp-cur{
  margin:10px 20px 0;background:#fff;border:1px solid var(--line);border-radius:14px;
  padding:10px 12px;display:flex;align-items:center;gap:11px;
}
.pp-cur-ic{
  width:40px;height:40px;border-radius:11px;flex:none;overflow:hidden;background:#EAF3EC;
  display:flex;align-items:center;justify-content:center;
}
.pp-cur-ic svg{width:100%;height:100%;display:block}
.pp-cur-txt{min-width:0}
.pp-cur-name{font-size:14px;font-weight:700}
.pp-cur-desc{font-size:11px;color:var(--gray);margin-top:2px}
.pp-cur .re{margin-left:auto;flex:none;color:var(--green2);font-size:12.5px;font-weight:600;background:none;border:none;font-family:inherit;cursor:pointer}
/* 模型列表 */
.model-list{display:flex;flex-direction:column;gap:9px}
.model-row{
  background:#fff;border:1.5px solid var(--line);border-radius:14px;padding:11px 13px;
  display:flex;align-items:center;gap:11px;cursor:pointer;transition:border-color .16s,background .16s,transform .12s;
}
.model-row:active{transform:scale(.985)}
.model-row.on{border-color:var(--green2);background:#F4FBF7}
.model-logo{
  width:32px;height:32px;border-radius:10px;flex:none;display:flex;align-items:center;justify-content:center;
  font-size:13px;font-weight:800;color:#fff;letter-spacing:-.02em;
}
.model-main{min-width:0;flex:1}
.model-name{font-size:13.5px;font-weight:700;display:flex;align-items:center;gap:6px}
.model-tag{font-size:9.5px;font-weight:600;padding:1.5px 5px;border-radius:5px;background:#F8EFDB;color:var(--gold);letter-spacing:.02em}
.model-tag.free{background:#E3F2EA;color:var(--deep)}
.model-sub{font-size:10.5px;color:var(--gray);margin-top:3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.model-radio{
  width:19px;height:19px;border-radius:50%;border:1.5px solid #D7DBD6;flex:none;
  display:flex;align-items:center;justify-content:center;transition:all .16s;
}
.model-row.on .model-radio{border-color:var(--green2);background:var(--green2)}
.model-radio::after{content:'';width:7px;height:7px;border-radius:50%;background:#fff;transform:scale(0);transition:transform .16s}
.model-row.on .model-radio::after{transform:scale(1)}
/* 提示词 */
.pp-box{background:#fff;border:1.5px solid var(--line);border-radius:14px;padding:11px 13px 9px}
.pp-box:focus-within{border-color:var(--green2)}
.pp-box textarea{
  width:100%;min-height:76px;max-height:110px;border:none;outline:none;resize:none;background:none;
  font-family:inherit;font-size:13px;line-height:1.62;color:var(--ink);user-select:text;
}
.pp-box textarea::placeholder{color:var(--gray2)}
.pp-count{text-align:right;font-size:10.5px;color:var(--gray2);margin-top:2px}
.pp-chips{display:flex;flex-wrap:wrap;gap:7px;margin-top:10px}
.pp-sub{display:flex;align-items:baseline;gap:8px;margin:18px 0 -2px}
.pp-sub > span{font-size:12.5px;font-weight:700;color:var(--deep)}
.pp-sub > em{font-size:10.5px;font-style:normal;color:var(--muted)}
/* 六档风格排成 3×2，避免最后一个孤零零换行 */
.pp-chips:has(> .pp-chip:nth-child(6):last-child){display:grid;grid-template-columns:repeat(3,1fr);gap:8px 7px}
.pp-chips:has(> .pp-chip:nth-child(6):last-child) > .pp-chip{justify-content:center;text-align:center}
/* 极简坐标：地名 + 经纬度表单 */
.pp-coord{background:#fff;border:1.5px solid var(--line);border-radius:14px;padding:11px 13px;display:flex;flex-direction:column;gap:9px}
.pp-coord:focus-within{border-color:var(--green2)}
.pp-field{display:flex;align-items:center;gap:10px}
.pp-flabel{font-size:11.5px;color:var(--gray);flex:none;width:28px}
.pp-text{
  flex:1;min-width:0;border:none;outline:none;background:#F6F8F4;border-radius:9px;
  padding:8px 10px;font-family:inherit;font-size:13px;color:var(--ink);user-select:text;
  transition:background .15s,box-shadow .15s;
}
.pp-text:focus{background:#F1F8F4;box-shadow:inset 0 0 0 1.5px #BEE3D2}
.pp-coord-row{display:flex;gap:9px}
.pp-coord-row .pp-field{flex:1;min-width:0}
.pp-gps{
  display:flex;align-items:center;justify-content:center;gap:6px;height:36px;
  background:#F1F8F4;border:1px dashed #BEE3D2;border-radius:10px;
  font-size:12px;color:var(--deep);font-weight:600;font-family:inherit;cursor:pointer;
}
.pp-gps:active{background:#E7F5ED}
.pp-preview{
  display:flex;align-items:baseline;gap:8px;border-top:1px dashed var(--line);padding-top:9px;
}
.pp-preview .k{font-size:11px;color:var(--gray);flex:none}
.pp-preview .v{font-size:12.5px;font-weight:700;color:var(--deep);letter-spacing:.01em}
/* 极简坐标：一张照片一组坐标 */
.pp-coord-head{display:flex;align-items:baseline;justify-content:space-between;gap:8px;margin:0 2px 9px}
.pp-coord-head .k{font-size:11.5px;color:var(--gray)}
.pp-coord-head .n{font-size:11.5px;color:var(--deep);font-weight:600;flex:none}
.pp-card{background:#fff;border:1.5px solid var(--line);border-radius:14px;padding:11px 12px 12px;margin-bottom:9px}
.pp-card:focus-within{border-color:var(--green2)}
.pp-card-top{display:flex;align-items:center;gap:9px;margin-bottom:10px}
.pp-no{
  width:18px;height:18px;border-radius:50%;flex:none;background:#EDF4EE;color:var(--deep);
  font-size:10px;font-weight:700;display:flex;align-items:center;justify-content:center;
}
.pp-thumb{width:32px;height:32px;border-radius:8px;object-fit:cover;flex:none;background:#EFEEE8}
.pp-card-name{font-size:12.5px;font-weight:600;color:var(--ink);line-height:1.2}
.pp-card-loc{font-size:10.5px;color:var(--gray2);margin-top:2px}
.pp-gps-mini{
  margin-left:auto;flex:none;font-family:inherit;cursor:pointer;
  font-size:10.5px;color:var(--deep);font-weight:600;background:#F1F8F4;
  border:1px dashed #BEE3D2;border-radius:99px;padding:5px 9px;
}
.pp-gps-mini:active{background:#E7F5ED}
.pp-chip{
  font-size:11.5px;color:var(--ink2);background:#fff;border:1px solid var(--line);
  border-radius:20px;padding:5px 11px;cursor:pointer;transition:all .14s;
}
.pp-chip:active{transform:scale(.94)}
.pp-chip.on{background:#E3F2EA;border-color:#BEE3D2;color:var(--deep);font-weight:600}
.pp-tip{font-size:10.5px;color:var(--gray2);line-height:1.6;padding:12px 22px 0;text-align:center}
.pp-bar{position:absolute;bottom:0;left:0;right:0;padding:12px 20px 28px;background:var(--bg);border-top:1px solid var(--line)}
.pp-bar .btn-green{height:52px;font-size:16px;width:100%}
.pp-bar .pp-bar-note{text-align:center;font-size:10.5px;color:var(--gray2);margin-top:8px}

/* ============ 生成中 ============ */
.generating{
  position:absolute;inset:0;z-index:60;background:rgba(247,248,245,.97);
  display:flex;flex-direction:column;align-items:center;justify-content:center;padding:0 40px;
}
.gen-ring{width:104px;height:104px;position:relative}
.gen-ring svg{transform:rotate(-90deg)}
.gen-ring .pct{
  position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;
}
.gen-num{font-size:26px;font-weight:800;color:var(--deep)}
.gen-num small{font-size:13px;font-weight:600}
.gen-steps{margin-top:30px;width:100%;max-width:280px}
.gen-step{display:flex;align-items:center;gap:11px;padding:8px 0;color:var(--gray2);font-size:14px;transition:color .3s}
.gen-step .dot{
  width:22px;height:22px;border-radius:50%;border:2px solid var(--line);flex:none;
  display:flex;align-items:center;justify-content:center;transition:all .3s;background:#fff;
}
.gen-step.active{color:var(--ink);font-weight:600}
.gen-step.active .dot{border-color:var(--green2)}
.gen-step.active .dot::after{content:"";width:10px;height:10px;border-radius:50%;background:var(--green2);animation:pulse 1s infinite}
.gen-step.done{color:var(--ink2)}
.gen-step.done .dot{border-color:var(--green2);background:var(--green2);color:#fff}
@keyframes pulse{0%,100%{transform:scale(1);opacity:1}50%{transform:scale(.7);opacity:.6}}
.gen-title{font-size:19px;font-weight:800;margin-top:26px;letter-spacing:.02em}
.gen-mode{font-size:11.5px;color:var(--gray);margin-top:7px;letter-spacing:.02em}

/* ============ 作品结果 / AI 标注 ============ */
.result-photo-wrap{
  position:relative;flex:1;min-height:0;overflow:hidden;background:#0d120e;
  display:flex;align-items:center;justify-content:center;
}
.photo-fit{position:relative;flex:none;line-height:0}
.photo-fit>img{width:100%;height:100%;object-fit:cover;display:block}

/* ============ 效果：极简坐标（minimal-coordinate skill） ============ */
.min-overlay{position:absolute;inset:0;pointer-events:none;z-index:2;overflow:hidden}
.min-cluster{position:absolute;animation:minMapIn .85s cubic-bezier(.2,.7,.3,1) .12s both}
.min-map{display:block;width:100%;height:auto;overflow:visible}
.min-location-dot{
  position:absolute;width:6px;height:6px;margin:-3px 0 0 -3px;border-radius:50%;
  background:#CF453F;box-shadow:0 0 0 1px rgba(255,255,255,.78);
}
.min-dot{opacity:0;transition:opacity .45s ease}
.min-dot.on{opacity:1}
@keyframes minMapIn{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:none}}

.photo-fit.wide .anno-chip{max-width:42%;padding:5px 8px;border-radius:9px}
.photo-fit.wide ~ .result-thumbs{
  top:auto;bottom:98px;left:50%;right:auto;transform:translateX(-50%);
  flex-direction:row;background:rgba(255,255,255,.10);padding:6px;border-radius:14px;
  backdrop-filter:blur(6px);border:1px solid rgba(255,255,255,.14);
}
.photo-fit.wide .anno-chip .a-title{font-size:11px;line-height:1.3}
.photo-fit.wide .anno-chip .a-term{font-size:9px;padding:0 5px;margin-top:3px}
.photo-fit.wide .anno-chip .a-detail{font-size:9.5px;margin-top:4px}
.anno-svg{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}
.anno-chip{
  position:absolute;max-width:64%;pointer-events:auto;cursor:pointer;z-index:2;
  background:rgba(16,24,18,.82);backdrop-filter:blur(3px);
  border:1px solid var(--c,#3FBF85);border-radius:10px;padding:7px 10px;color:#fff;
  line-height:1.45;   /* 父级 .photo-fit 是 line-height:0，不显式给会让术语标签被压扁、文字压线 */
  opacity:0;transform:scale(.6);
  transition:opacity .35s,transform .35s cubic-bezier(.2,.9,.3,1.4);
  box-shadow:0 6px 16px rgba(0,0,0,.3);
}
.anno-chip.show{opacity:1;transform:scale(1)}
.anno-chip.expanded{z-index:6;backdrop-filter:none;background:rgba(16,24,18,.94)}
.anno-chip.expanded.show{transform:scale(1)}
.anno-chip .a-title{font-size:12.5px;font-weight:700;line-height:1.35}
.anno-chip .a-term{
  display:inline-block;margin-top:5px;font-size:10px;line-height:1.7;font-weight:600;color:var(--c,#3FBF85);
  border:1px solid var(--c,#3FBF85);border-radius:5px;padding:0 6px;letter-spacing:.03em;
}
.anno-chip .a-detail{font-size:10.5px;line-height:1.5;color:rgba(255,255,255,.82);margin-top:6px;display:none}
.anno-chip.expanded .a-detail{display:block}
.anno-summary{
  position:absolute;left:12px;right:12px;bottom:12px;z-index:5;
  background:rgba(16,24,18,.8);backdrop-filter:blur(6px);border-radius:14px;padding:12px 14px;color:#fff;
  display:flex;gap:10px;align-items:flex-start;opacity:0;transform:translateY(18px);transition:all .5s .1s;
  border:1px solid rgba(255,255,255,.14);
}
.anno-summary.show{opacity:1;transform:none}
.anno-summary .s-icon{flex:none;width:30px;height:30px;border-radius:9px;background:var(--green2);display:flex;align-items:center;justify-content:center;margin-top:1px}
.anno-summary .s-text{font-size:11.5px;line-height:1.55;color:rgba(255,255,255,.92)}
.result-topbar{
  position:absolute;top:0;left:0;right:0;z-index:6;padding:56px 14px 30px;
  background:linear-gradient(rgba(10,16,12,.55),transparent);
  display:flex;align-items:center;gap:10px;
}
.result-topbar .title{color:#fff;font-size:15px;font-weight:700;text-shadow:0 1px 6px rgba(0,0,0,.4)}
.result-topbar .tpl-name-tag{margin-left:auto;font-size:11px;color:#fff;background:rgba(255,255,255,.2);backdrop-filter:blur(4px);padding:4px 10px;border-radius:8px}
.result-thumbs{
  position:absolute;right:12px;top:50%;transform:translateY(-50%);z-index:6;display:flex;flex-direction:column;gap:8px;
}
.result-thumb{
  width:44px;height:44px;border-radius:10px;overflow:hidden;cursor:pointer;opacity:.55;
  border:2px solid transparent;transition:all .2s;position:relative;
}
.result-thumb.on{opacity:1;border-color:#fff}
.result-thumb img{width:100%;height:100%;object-fit:cover}
.result-thumb .t-ai{position:absolute;right:2px;bottom:2px;font-size:8px;background:var(--green2);color:#fff;border-radius:4px;padding:0 3px;font-weight:700}
.result-actions{padding:13px 16px 26px;background:var(--bg);border-top:1px solid var(--line)}
.result-actions .btn-green{height:50px;font-size:16px}
.result-sub-row{display:flex;gap:10px;margin-top:10px}
.result-sub-row .btn-ghost{flex:1;height:44px;font-size:14px}

/* ============ 效果：明信片（原片 + 水彩绘版 + 色卡 + 手写标题） ============ */
.pc-scroll{position:absolute;inset:0;overflow-y:auto;padding:78px 18px 26px;-webkit-overflow-scrolling:touch}
.pc-reveal{will-change:transform}
.pc-sheet{
  background:#FBF7EC;border-radius:12px;overflow:hidden;
  box-shadow:0 16px 40px rgba(0,0,0,.55),inset 0 0 0 1px rgba(255,255,255,.5);
  position:relative;
}
.pc-photo{position:relative;line-height:0;background:#E7E2D4;aspect-ratio:3/2;overflow:hidden}
.pc-photo img{width:100%;height:100%;object-fit:cover;object-position:50% 42%;display:block}
.pc-photo .pc-badge{
  position:absolute;left:10px;bottom:9px;font-size:9px;letter-spacing:.14em;color:#fff;
  background:rgba(12,18,14,.72);border:1px solid rgba(255,255,255,.45);border-radius:4px;
  padding:2px 7px;backdrop-filter:blur(4px);text-shadow:0 1px 2px rgba(0,0,0,.5);
}
.pc-rule{height:1px;background:rgba(42,42,38,.14)}
.pc-art{position:relative;margin:12px 12px 0;height:168px;overflow:hidden;background:#FBF7EC}
.pc-art img{width:100%;height:100%;object-fit:cover;display:block}
.pc-art::before{
  content:'';position:absolute;inset:0;z-index:2;pointer-events:none;
  box-shadow:inset 0 0 0 1px rgba(120,110,90,.12), inset 0 0 22px 8px rgba(251,247,236,.55);
}
.pc-art::after{
  content:'';position:absolute;inset:0;pointer-events:none;
  background:radial-gradient(132% 112% at 50% 46%,rgba(251,247,236,0) 62%,rgba(251,247,236,.42) 86%,rgba(251,247,236,.9) 100%);
}
.pc-wash{
  position:absolute;inset:0;pointer-events:none;mix-blend-mode:soft-light;opacity:.85;
  background:linear-gradient(160deg,rgba(255,255,255,.42),rgba(120,160,150,.22) 52%,rgba(230,200,140,.28));
}
.pc-grain{
  position:absolute;inset:0;pointer-events:none;opacity:.55;mix-blend-mode:multiply;
  background-image:radial-gradient(rgba(60,50,35,.14) .6px,transparent .6px);
  background-size:3px 3px;
}
/* 六档手账画风：同一套版式，换笔触 */
.pc-sheet[data-style="pen"]    .pc-art img{filter:url(#pcPaint1) saturate(1.24) contrast(.9) brightness(1.12)}
.pc-sheet[data-style="wet"]    .pc-art img{filter:url(#pcPaint2) saturate(1.5) contrast(.82) brightness(1.16) blur(.9px)}
.pc-sheet[data-style="film"]   .pc-art img{filter:url(#pcPaint1) sepia(.34) saturate(.84) contrast(1.05) brightness(1.02)}
.pc-sheet[data-style="pencil"] .pc-art img{filter:url(#pcPaint1) grayscale(1) contrast(1.22) brightness(1.12)}
.pc-sheet[data-style="washi"]  .pc-art img{filter:url(#pcPaint2) sepia(.16) saturate(.8) contrast(.94) brightness(1.1)}
/* 第六档 · 纸面留白：不另起绘版，照片下半直接化纸，铅笔线顺着走成细细的草 */
.pc-sheet[data-style="paper"] .pc-photo{aspect-ratio:3/4;background:#FAF5E7}
.pc-sheet[data-style="paper"] .pc-photo img{
  object-position:50% 34%;
  -webkit-mask-image:linear-gradient(to bottom,#000 0%,#000 58%,rgba(0,0,0,.82) 68%,rgba(0,0,0,.42) 78%,rgba(0,0,0,.12) 88%,rgba(0,0,0,0) 96%);
  mask-image:linear-gradient(to bottom,#000 0%,#000 58%,rgba(0,0,0,.82) 68%,rgba(0,0,0,.42) 78%,rgba(0,0,0,.12) 88%,rgba(0,0,0,0) 96%);
}
.pc-paper{
  position:absolute;inset:0;pointer-events:none;mix-blend-mode:multiply;opacity:.12;
  background:
    repeating-linear-gradient(76deg,rgba(90,82,66,.9) 0 1px,transparent 1px 4px),
    repeating-linear-gradient(-58deg,rgba(90,82,66,.7) 0 1px,transparent 1px 7px);
  -webkit-mask-image:linear-gradient(to bottom,transparent 56%,rgba(0,0,0,.45) 72%,#000 88%,#000 100%);
  mask-image:linear-gradient(to bottom,transparent 56%,rgba(0,0,0,.45) 72%,#000 88%,#000 100%);
}
.pc-sheet[data-style="paper"] .pc-art{display:none}
.pc-sheet[data-style="paper"] .pc-badge{display:none}
.pc-mark{
  position:absolute;right:20px;bottom:22px;z-index:3;line-height:1.2;
  font-family:'Segoe Script','Snell Roundhand','Bradley Hand','Lucida Handwriting',cursive;
  font-size:14px;color:#8A8371;transform:rotate(-2.5deg);
}
.pc-foot{padding:12px 18px 16px;text-align:center}
.pc-script{
  font-family:'Segoe Script','Snell Roundhand','Bradley Hand','Lucida Handwriting',cursive;
  font-size:20px;line-height:1.28;color:#3A3A32;letter-spacing:.01em;
}
.pc-sub{
  font-family:'Segoe Script','Snell Roundhand','Bradley Hand',cursive;
  font-style:italic;font-size:11.5px;line-height:1.6;color:#8C8674;margin-top:1px;
  display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;
}
.pc-note{
  margin:11px auto 0;max-width:88%;padding-top:9px;border-top:1px dashed rgba(42,42,38,.2);
  font-size:11px;line-height:1.75;color:#6C6757;text-align:left;
}
.pc-swatches{display:flex;gap:7px;justify-content:center;margin-top:13px}
.pc-sheet[data-style="pencil"] .pc-sw{filter:grayscale(1) contrast(.92)}
.pc-sheet[data-style="film"] .pc-sw{filter:sepia(.28) saturate(.9)}
.pc-sheet[data-style="washi"] .pc-sw{filter:saturate(.72) brightness(1.06)}
.pc-sw{width:44px;height:24px;border-radius:6px;box-shadow:inset 0 0 0 1px rgba(0,0,0,.06),0 1px 2px rgba(0,0,0,.06)}
.pc-sign{display:flex;align-items:center;justify-content:space-between;padding:0 14px 12px;font-size:9px;letter-spacing:.16em;color:#B0A894}
.result-thumbs.pc-thumbs{
  position:static;transform:none;width:max-content;margin:16px auto 0;
  flex-direction:row;background:rgba(255,255,255,.1);padding:6px;border-radius:14px;
  backdrop-filter:blur(6px);border:1px solid rgba(255,255,255,.14);
}

/* ============ 效果：抽象画（双色套印 + 纸面 + 印章） ============ */
.ab-sheet{
  background:#F2EEE1;border-radius:12px;overflow:hidden;
  box-shadow:0 16px 40px rgba(0,0,0,.55),inset 0 0 0 1px rgba(255,255,255,.5);
}
.ab-stage{position:relative;margin:12px 12px 0;aspect-ratio:1/1;background:#EAE4D2;overflow:hidden}
.ab-stage img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;display:block}
.ab-base{filter:grayscale(1) contrast(1.55) brightness(1.08)}
.ab-plate{filter:grayscale(1) contrast(2.1);mix-blend-mode:multiply;opacity:.26;transform:translate(4px,-3px)}
.ab-ink{
  position:absolute;inset:0;mix-blend-mode:multiply;opacity:.62;
  background:linear-gradient(112deg,var(--ink-a) 0%,var(--ink-a) 44%,var(--ink-b) 44%,var(--ink-b) 100%);
}
.ab-sheet[data-style="构成主义"] .ab-ink{background:linear-gradient(160deg,var(--ink-a) 0%,var(--ink-a) 34%,var(--ink-b) 34%,var(--ink-b) 100%)}
.ab-sheet[data-style="剪纸拼贴"] .ab-ink{background:linear-gradient(90deg,var(--ink-a) 0%,var(--ink-a) 52%,var(--ink-b) 52%,var(--ink-b) 100%)}
.ab-sheet[data-style="极简留白"] .ab-ink{opacity:.34;background:linear-gradient(180deg,var(--ink-a) 0%,var(--ink-a) 62%,var(--ink-b) 62%,var(--ink-b) 100%)}
.ab-sheet[data-style="丝网版画"] .ab-ink{opacity:.66;background:linear-gradient(108deg,var(--ink-a) 0%,var(--ink-a) 46%,var(--ink-b) 46%,var(--ink-b) 100%)}
.ab-grain{
  position:absolute;inset:0;mix-blend-mode:multiply;opacity:.15;
  background-image:radial-gradient(rgba(40,32,20,.9) .7px,transparent .7px);background-size:4px 4px;
}
.ab-seal{
  position:absolute;right:9px;bottom:9px;width:26px;height:26px;border-radius:2px;
  background:#B23A2A;color:#F7EFDC;font-size:9.5px;line-height:1.15;font-weight:600;letter-spacing:0;
  display:flex;align-items:center;justify-content:center;opacity:.94;writing-mode:vertical-rl;
  box-shadow:0 1px 2px rgba(0,0,0,.22);
}
.ab-foot{padding:14px 18px 16px;text-align:center}
.ab-meta{display:flex;justify-content:space-between;font-size:9px;letter-spacing:.2em;color:#A29880}
.ab-title{
  font-family:'Segoe Script','Snell Roundhand','Bradley Hand','Lucida Handwriting',cursive;
  font-size:19px;line-height:1.3;color:#3A3A32;margin-top:6px;letter-spacing:.01em;
}
.ab-band{
  display:flex;height:18px;margin:14px auto 0;max-width:220px;border-radius:3px;overflow:hidden;
  box-shadow:inset 0 0 0 1px rgba(43,38,28,.08);
}
.ab-band span{flex:1}
.ab-note{
  margin:12px auto 0;max-width:90%;padding-top:9px;border-top:1px dashed rgba(42,42,38,.2);
  font-size:11px;line-height:1.75;color:#6C6757;text-align:left;
}

/* ============ 效果：抽象画 · 剪贴明信片（主体剪下来贴在色块上） ============ */
.cl-sheet{
  position:relative;aspect-ratio:3/4;overflow:hidden;border-radius:12px;
  background:#F7F1DE;
  box-shadow:0 16px 40px rgba(0,0,0,.55),inset 0 0 0 1px rgba(255,255,255,.5);
}
.cl-paper{
  position:absolute;inset:0;pointer-events:none;mix-blend-mode:multiply;opacity:.55;
  background-image:radial-gradient(rgba(120,110,86,.34) .6px,transparent .6px);
  background-size:3px 3px;
}
/* 背后那块色：只在上缘撕开，其余压直边 */
.cl-block{
  position:absolute;left:17%;top:17%;width:66%;height:31%;
  background:var(--cl-ink);transform:rotate(.7deg);
  clip-path:polygon(0% 3%,7% 1%,15% 3%,24% 0%,33% 2%,42% 0%,51% 3%,60% 1%,
                    69% 3%,78% 0%,87% 2%,95% 0%,100% 2%,100% 100%,0% 100%);
}
/* 主体：剪下来的一块，带纸边与毛口 */
.cl-cut{
  position:absolute;left:19%;top:28%;width:60%;height:42%;
  padding:3px;background:#FBF6E7;transform:rotate(-.9deg);
  filter:url(#clTear);
  clip-path:polygon(1% 4%,20% 1%,40% 3%,60% 0%,80% 2%,98% 1%,
                    100% 24%,97% 48%,100% 72%,96% 98%,
                    78% 96%,58% 99%,38% 96%,18% 99%,1% 96%,
                    4% 72%,0% 48%,3% 24%);
}
.cl-cut img{display:block;width:100%;height:100%;object-fit:cover;object-position:50% 42%;
  filter:grayscale(1) contrast(1.26) brightness(1.04)}
/* 版面上的细标尺 */
.cl-cross{position:absolute;right:7%;top:24%;width:26%;height:34%;pointer-events:none;
  border-right:1px dashed rgba(70,64,48,.34);border-bottom:1px dashed rgba(70,64,48,.34)}
.cl-cross::before{content:'';position:absolute;right:-2px;top:33%;width:5px;border-top:1px solid rgba(70,64,48,.4)}
.cl-cross::after{content:'';position:absolute;right:0;bottom:33%;height:5px;border-right:1px solid rgba(70,64,48,.4)}
.cl-cap{position:absolute;left:8%;right:8%;bottom:9%}
.cl-rule{height:1px;background:rgba(58,54,42,.45);margin-bottom:9px}
.cl-title{
  font-family:Georgia,'Times New Roman','Songti SC',serif;
  font-size:23px;line-height:1.15;color:#33322A;letter-spacing:-.01em;text-align:right;
}
.cl-no{
  margin-top:6px;text-align:right;font-size:9px;letter-spacing:.2em;color:#8B8471;
  text-transform:uppercase;
}
.cl-note{
  margin-top:11px;padding-top:8px;border-top:1px dashed rgba(58,54,42,.22);
  font-size:10.5px;line-height:1.7;color:#77705D;
}

/* ============ 效果：中国风 · 手绘舆图 ============ */
.at-sheet{
  position:relative;aspect-ratio:400/620;overflow:hidden;border-radius:12px;
  --at-paper:#EFE7D2;
  --at-halo:#F6F0DE;
  --at-m1:#B2C8BA; --at-m2:#89A996; --at-m3:#668F79;
  --at-tree:#4A6B57; --at-water:#7FA8B6; --at-red:#B2372A;
  --at-route:#4A4438; --at-ink:#4A4438;
  --at-sand:#E4D3B0; --at-sandline:#C8AE86; --at-cloud:#FBF7EA;
  background:var(--at-paper);
  box-shadow:0 16px 40px rgba(0,0,0,.55),inset 0 0 0 1px rgba(255,255,255,.4);
}
.at-paper{
  position:absolute;inset:0;pointer-events:none;mix-blend-mode:multiply;opacity:.85;
  background:
    radial-gradient(130% 95% at 50% 38%,rgba(255,255,255,.46) 0%,rgba(255,255,255,0) 46%,rgba(150,128,92,.26) 100%),
    radial-gradient(rgba(120,104,76,.28) .6px,transparent .6px);
  background-size:auto,3px 3px;
}
.at-canvas{position:relative;display:block;width:100%;height:100%}
.at-zh{font-family:'Songti SC','SimSun','Noto Serif SC',serif;font-size:12.5px;font-weight:600;fill:#2B2822;
  stroke:var(--at-halo);stroke-width:2.6;paint-order:stroke;stroke-linejoin:round}
.at-en{font-family:'Helvetica Neue',Arial,sans-serif;font-size:6.6px;letter-spacing:.15em;fill:#332F27;
  stroke:var(--at-halo);stroke-width:1.7;paint-order:stroke;stroke-linejoin:round}
.at-prov{font-family:'Songti SC','SimSun',serif;font-size:6.2px;fill:#5E5747;
  stroke:var(--at-halo);stroke-width:1.6;paint-order:stroke;stroke-linejoin:round}
.at-big{font-family:'Songti SC','SimSun','Noto Serif SC',serif;font-size:17px;letter-spacing:.16em;fill:#6D6553;opacity:.62;
  stroke:var(--at-halo);stroke-width:2.4;paint-order:stroke}
.at-big-en{font-family:'Helvetica Neue',Arial,sans-serif;font-size:6.5px;letter-spacing:.3em;fill:#6D6553;opacity:.7;
  stroke:var(--at-halo);stroke-width:1.4;paint-order:stroke}
.at-scale text{font-family:'Helvetica Neue',Arial,sans-serif;fill:#5A5446;letter-spacing:.08em}
.at-foot{
  position:absolute;left:0;right:0;bottom:0;padding:16px 16px 12px;text-align:center;
  background:linear-gradient(to top,rgba(239,231,210,.98) 30%,rgba(239,231,210,0) 100%);
}
.at-title{font-family:'Songti SC','SimSun',serif;font-size:13px;color:#3A362C;letter-spacing:.16em}
.at-sub{font-size:9.5px;color:#8A8272;margin-top:3px;letter-spacing:.05em}
/* 五档古意：换纸、换山色、换线 */
.at-sheet[data-style="水墨淡彩"]{--at-m1:#B9B9B0;--at-m2:#8E8E84;--at-m3:#6A6A60;--at-tree:#5A5A50;--at-water:#9FA9A8}
.at-sheet[data-style="青绿山水"]{--at-m1:#8FBFA6;--at-m2:#4F8F72;--at-m3:#2F6B52;--at-tree:#2E5E46;--at-water:#5E97A6}
.at-sheet[data-style="绢本设色"]{--at-paper:#EDE0C2;--at-halo:#F8F0DA;--at-m1:#CEBE9C;--at-m2:#A8916A;--at-m3:#7C6A48;--at-tree:#5E4E32;--at-water:#8FA79A;--at-sand:#DFC79A}
.at-sheet[data-style="木刻线描"]{--at-paper:#F1EADA;--at-water:#6E6A5C;--at-route:#33302A}
.at-sheet[data-style="木刻线描"] .at-m{fill:none;stroke:#3A362C;stroke-width:.85;opacity:.9}
.at-sheet[data-style="木刻线描"] .at-paper{opacity:.4}

/* ============ 广场 ============ */
.square-header{padding:64px 22px 10px;display:flex;align-items:baseline;justify-content:space-between}
.square-header h1{font-size:28px;font-weight:800}
.square-header p{font-size:12px;color:var(--gray)}
.home-feed-note{margin:14px 22px 0;display:flex;align-items:center;gap:7px;font-size:12px;color:var(--gray)}
.home-feed-note::before{content:'';width:3px;height:11px;border-radius:2px;background:var(--green2)}
.feed-item{margin:12px 22px 0;background:#fff;border:1px solid var(--line);border-radius:18px;overflow:hidden;cursor:pointer;transition:transform .15s}
.feed-item:active{transform:scale(.975)}
.feed-head{display:flex;align-items:center;gap:10px;padding:13px 14px 0}

/* 广场：直接把成图放上来（明信片 / 抽象 / 剪贴 / 舆图），不再退回原片 */
.feed-art{position:relative;margin:11px 14px 0;border-radius:13px;overflow:hidden;background:#0e1310;line-height:0}
.feed-art .pc-sheet,.feed-art .ab-sheet,.feed-art .cl-sheet,.feed-art .at-sheet{border-radius:0;box-shadow:none}

.fv-slide.fv-art-slide{display:block;padding:84px 16px 150px;overflow-y:auto}
.fv-slide.fv-art-slide .pc-sheet,.fv-slide.fv-art-slide .ab-sheet,
.fv-slide.fv-art-slide .cl-sheet,.fv-slide.fv-art-slide .at-sheet{width:100%;box-shadow:0 18px 40px rgba(0,0,0,.45)}
.sheet-preview.pv-art{width:252px;max-height:352px;overflow:hidden;background:#F4F0E4}

.workdetail-art{flex:1;overflow-y:auto;padding:70px 16px 18px}

.poster-photo.pv-art .cl-sheet,.poster-photo.pv-art .at-sheet{border-radius:0;box-shadow:none;width:100%}
.poster-photo.pv-art .pc-sheet,.poster-photo.pv-art .ab-sheet,
.poster-photo.pv-art .cl-sheet,.poster-photo.pv-art .at-sheet{border-radius:0;box-shadow:none;width:100%}
.feed-photo img{width:100%;height:100%;object-fit:cover}
/* 多图精选帖：卡片内右滑翻图 */
.feed-photo.feed-multi{height:300px}
.fm-track{display:flex;height:100%;overflow-x:auto;scroll-snap-type:x mandatory;scrollbar-width:none;cursor:grab;touch-action:pan-x pan-y}
.fm-track img{-webkit-user-drag:none;user-select:none}

.feed-chips{position:absolute;left:10px;bottom:10px;display:flex;gap:6px;flex-wrap:wrap}
.feed-chips .fchip{font-size:10px;background:rgba(16,24,18,.72);color:#fff;backdrop-filter:blur(3px);border:1px solid rgba(255,255,255,.35);border-radius:6px;padding:2px 7px;font-weight:600}
.feed-body{padding:11px 14px 13px}
.feed-summary{font-size:13px;color:var(--ink2);line-height:1.55}
.feed-loc{display:flex;align-items:center;gap:4px;font-size:11px;color:var(--gray);margin-top:7px}
/* 多图帖全屏浏览（右滑翻页） */
.fv-head{position:absolute;top:0;left:0;right:0;z-index:3;padding:56px 20px 40px;display:flex;align-items:center;gap:12px;background:linear-gradient(180deg,rgba(6,10,8,.78),rgba(6,10,8,0))}

.fv-time{font-size:11px;color:rgba(255,255,255,.6);margin-top:2px}
.fv-track{position:absolute;inset:0;display:flex;overflow-x:auto;scroll-snap-type:x mandatory;scrollbar-width:none}
.fv-track::-webkit-scrollbar{display:none}
.fv-slide{flex:0 0 100%;scroll-snap-align:start;display:flex;align-items:center;justify-content:center;padding:96px 18px 156px}

================================================================ */
const MIN_MAPS = {
  /* 透明局部地图资产（区域路网+水系+地名内嵌，边缘羽化）；红点由前端按地图内坐标定位 */
  'assets/raw1_yunnan.jpg': {
    asset:'assets/maps/yijiu.svg', anchor:{x:4, y:4, w:48}, dot:{x:30.2, y:17.6}
  },
  'assets/raw2_luya.jpg': {
    asset:'assets/maps/luya.svg', anchor:{x:3, y:3, w:28}, dot:{x:18, y:22.1}
  },
  'assets/raw3_yuci.jpg': {
    asset:'assets/maps/yuci.svg', anchor:{x:2, y:1.5, w:26.5}, dot:{x:70.8, y:31.3}
  }
};

function buildMinimalOverlay(photo){
  const cfg = MIN_MAPS[photo.src];
  if(!cfg) return '';
  return `<div class="min-overlay">
    <div class="min-cluster" style="left:${cfg.anchor.x}%;top:${cfg.anchor.y}%;width:${cfg.anchor.w}%">
      <img class="min-map" src="${cfg.asset}" alt="">
      <span class="min-location-dot min-dot" style="left:${cfg.dot.x}%;top:${cfg.dot.y}%"></span>
    </div>
  </div>`;
}

/* 让照片按原图比例完整显示，标注坐标才能对齐（横竖幅混排也不会错位） */
function fitPhoto(wrap){
  if(!wrap) return;
  const fit = wrap.querySelector('.photo-fit');
  if(!fit) return;
  const img = fit.querySelector('img');
  if(!img) return;
  const apply = ()=>{
    const bw = wrap.clientWidth, bh = wrap.clientHeight;
    if(!bw || !bh) return;
    const nw = img.naturalWidth || 3, nh = img.naturalHeight || 4;
    const r = nw/nh;
    let w = bw, h = bw/r;
    if(h > bh){ h = bh; w = bh*r; }
    fit.style.width = Math.round(w)+'px';
    fit.style.height = Math.round(h)+'px';
    fit.classList.toggle('wide', r > 1.05);
    layoutAnnoChips(fit);
  };
  if(img.complete && img.naturalWidth) apply();
  img.addEventListener('load', apply);
  requestAnimationFrame(apply);
}
/* 标注卡片避让：先按锚点落位，再收敛到照片内并两两错开，避免字压字 / 卡片互盖 */
function layoutAnnoChips(fit){
  if(!fit) return;
  const W = fit.clientWidth, H = fit.clientHeight;
  if(!W || !H) return;
  const pad = 6, gap = 8;
  const chips = [].slice.call(fit.querySelectorAll('.anno-chip'));
  if(!chips.length) return;
  const items = chips.map((c,i)=>({
    el:c, i:i,
    w: Math.min(c.offsetWidth || 0, W - pad*2),
    h: c.offsetHeight || 0,
    cx: parseFloat(c.dataset.cx),
    cy: parseFloat(c.dataset.cy)
  })).filter(it=> it.w > 0);
  if(!items.length) return;
  items.sort((a,b)=> a.cy - b.cy || a.cx - b.cx || a.i - b.i);
  const placed = [];
  items.forEach(it=>{
    let x = it.cx/100*W, y = it.cy/100*H;
    x = Math.max(pad, Math.min(x, W - it.w - pad));
    y = Math.max(pad, Math.min(y, H - it.h - pad));
    for(let guard=0; guard<40; guard++){
      const hit = placed.find(p=> x < p.x+p.w+gap && p.x < x+it.w+gap && y < p.y+p.h+gap && p.y < y+it.h+gap);
      if(!hit) break;
      const below = hit.y + hit.h + gap;
      const above = hit.y - it.h - gap;
      if(below + it.h <= H - pad){
        y = below;                       /* 往下让 */
      }else if(above >= pad){
        y = above;                       /* 下方放不下，改往上让 */
      }else{
        const nx = Math.min(W - it.w - pad, hit.x + hit.w + gap);
        if(nx <= x + 0.5) break;         /* 实在挪不动，接受现状 */
        x = nx;
      }
    }
    placed.push({x:x, y:y, w:it.w, h:it.h});
    it.el.style.left = Math.round(x)+'px';
    it.el.style.top  = Math.round(y)+'px';
  });
}
/* 点开一条时收起其它条，并按新高度重新避让 */
function bindAnnoChips(fit){
  const chips = [].slice.call(fit.querySelectorAll('.anno-chip'));
  chips.forEach(c=>c.onclick=(e)=>{
    e.stopPropagation();
    const open = !c.classList.contains('expanded');
    chips.forEach(o=>{ if(o!==c) o.classList.remove('expanded'); });
    c.classList.toggle('expanded', open);
    layoutAnnoChips(fit);
    requestAnimationFrame(()=>layoutAnnoChips(fit));
    setTimeout(()=>layoutAnnoChips(fit), 80);
  });
}

/* 平滑轨迹：Catmull-Rom 转三次贝塞尔，传入的每个路径点都精确落在曲线上。
   起终点圆点、沿途照片点全部取自这组路径点，所以不会再和线脱开。 */
function smoothPath(pts, closed){
  const p = closed ? pts.slice(0,-1) : pts.slice();
  const n = p.length;
  const at = i => closed ? p[(i+n)%n] : p[Math.max(0, Math.min(n-1, i))];
  let d = `M${p[0][0]} ${p[0][1]}`;
  const segs = closed ? n : n-1;
  for(let i=0;i<segs;i++){
    const a=at(i-1), b=at(i), c=at(i+1), e=at(i+2);
    const c1x=b[0]+(c[0]-a[0])/6, c1y=b[1]+(c[1]-a[1])/6;
    const c2x=c[0]-(e[0]-b[0])/6, c2y=c[1]-(e[1]-b[1])/6;
    d += ` C${c1x.toFixed(1)} ${c1y.toFixed(1)} ${c2x.toFixed(1)} ${c2y.toFixed(1)} ${c[0]} ${c[1]}`;
  }
  return closed ? d+'Z' : d;
}

  const mtn = `<path d="M-5 104 35 40 60 75 88 28 130 90 165 45 205 104Z" fill="#7FA98A"/><path d="M-5 104 55 70 95 92 135 68 175 90 205 104Z" fill="#5E8A6C"/>`;
  const base = `<rect width="200" height="104" fill="#CFE0D3"/>${mtn}`;
  switch(id){
    case 'origin': return `<svg viewBox="0 0 200 104" preserveAspectRatio="xMidYMid slice">${base}</svg>`;
    case 'geo': return `<svg viewBox="0 0 200 104" preserveAspectRatio="xMidYMid slice">${base}
      <rect x="12" y="12" width="76" height="26" rx="7" fill="rgba(255,255,255,.92)"/>
      <rect x="20" y="20" width="44" height="4" rx="2" fill="#22A06B"/><rect x="20" y="29" width="58" height="4" rx="2" fill="#D9DED4"/>
      <path d="M150 22c8-7 20-4 22 5" stroke="#E8862E" stroke-width="2.4" fill="none" stroke-linecap="round"/></svg>`;
    case 'min': return `<svg viewBox="0 0 200 104" preserveAspectRatio="xMidYMid slice">${base}
      <image href="assets/maps/yijiu.svg" x="12" y="4" width="112" height="56" opacity=".82"/>
      <circle cx="76" cy="33" r="2.8" fill="#CF453F"/></svg>`;
    case 'postcard': return `<svg viewBox="0 0 200 104" preserveAspectRatio="xMidYMid slice"><rect width="200" height="104" fill="#F3ECDC"/>${mtn}
      <path d="M20 88 h160" stroke="#B8860B" stroke-width="1.6" stroke-dasharray="5 4"/></svg>`;
    case 'abstract': return `<svg viewBox="0 0 200 104" preserveAspectRatio="xMidYMid slice"><rect width="200" height="104" fill="#E9E4D2"/>
      <path d="M-5 104 40 45 70 80 105 35 150 85 185 55 205 104Z" fill="#8FA98B"/>
      <path d="M-5 104 60 78 110 95 150 75 205 104Z" fill="#B8875B" opacity=".8"/></svg>`;
    case 'china': return `<svg viewBox="0 0 200 104" preserveAspectRatio="xMidYMid slice"><rect width="200" height="104" fill="#EFE7D2"/>
      <path d="M30 84 C 55 60 40 40 80 34 C 120 28 115 55 150 48" stroke="#B0413E" stroke-width="2.6" fill="none" stroke-dasharray="1 6" stroke-linecap="round"/>
      <circle cx="30" cy="84" r="4" fill="#B0413E"/><circle cx="150" cy="48" r="4" fill="#B0413E"/>
      <circle cx="170" cy="24" r="10" fill="#D8A95A" opacity=".7"/></svg>`;
  }
}

function renderMain(){
  const p = el(`<div class="page" id="page-main">
    <div id="tab-pages" style="flex:1;position:relative;overflow:hidden"></div>
    <div class="tabbar">
      <div class="tab-item ${S.tab==='routes'?'active':''}" data-tab="routes"><span style="width:24px;height:24px;display:block">${ICONS.route}</span><span class="t-label">路线</span></div>
      <div class="tab-item center ${S.tab==='depart'?'active':''}" data-tab="depart"><div class="tab-fab"><span style="width:30px;height:30px;color:#fff;display:block">${ICONS.mountain}</span></div><span class="t-label" style="margin-top:2px">出发</span></div>
      <div class="tab-item ${S.tab==='mine'?'active':''}" data-tab="mine"><span style="width:24px;height:24px;display:block">${ICONS.person}</span><span class="t-label">我的</span></div>
      <div class="home-indicator"></div>
    </div>
  </div>`);
  p.querySelectorAll('.tab-item').forEach(t=>{
    t.onclick = ()=>switchTab(t.dataset.tab);
  });
  /* 节点尚未挂到 document，直接引用挂载 */
  const tab = S.tab||'routes';
  const host = p.querySelector('#tab-pages');
  host.appendChild(tab==='routes'?renderRoutes():tab==='mine'?renderMine():renderDepart());
  return p;
}
function switchTab(tab){
  if(S.tab===tab) return;
  S.tab = tab;
  document.querySelectorAll('#page-main .tab-item').forEach(t=>t.classList.toggle('active', t.dataset.tab===tab));
  mountTab(tab);
}
function mountTab(tab){
  const host = document.getElementById('tab-pages');
  host.innerHTML='';
  let page;
  if(tab==='routes') page = renderRoutes();
  else if(tab==='mine') page = renderMine();
  else page = renderDepart();
  host.appendChild(page);
}

function renderRouteDetail(route){
  const photos = route.photos.map(src=>`
    <div class="strip-item" data-src="${src}"><img src="${src}"><span class="ai-badge"><svg width="9" height="9" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="3" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>AI</span></div>`).join('');
  const p = el(`<div class="page" style="position:absolute;inset:0;z-index:10">
    <div class="page-body" style="padding-bottom:30px">
      <div class="detail-header">
        <div class="back-btn" id="back">${ICONS.back}</div>
        <h2>${route.name}</h2>
        <button class="fav-btn" id="fav">${ICONS.fav}<span id="fav-n">${route.fav}</span></button>
      </div>
      <div class="map-wrap" id="map-wrap">
        ${routeMapSVG(route)}
        <div class="map-legend"><span><i class="legend-dot" style="background:#22A06B"></i>轨迹路线</span><span><i class="legend-dot" style="background:#E8862E"></i>起终点</span></div>
        <div class="compass"><svg width="20" height="20" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9" fill="none" stroke="#86928B" stroke-width="1.6"/><path d="M12 5.5 14.5 13 12 11.6 9.5 13Z" fill="#E8862E"/></svg></div>
      </div>
      <div class="stat-row">
        <div class="stat-cell"><div class="stat-v">${route.km}<small> ${route.kmU}</small></div><div class="stat-k">路线距离</div></div>
        <div class="stat-cell"><div class="stat-v">${route.climb}<small> ${route.climbU}</small></div><div class="stat-k">累计爬升</div></div>
        <div class="stat-cell"><div class="stat-v">${route.time}</div><div class="stat-k">参考用时</div></div>
        <div class="stat-cell"><div class="stat-v ${route.diffC==='easy'?'easy':''}">${route.diff}</div><div class="stat-k">路线难度</div></div>
      </div>
      <div class="detail-social">
        <span class="detail-social-note">${route.hot} 人走过 · 收藏 ${route.fav}</span>
        <span class="sec-line"></span>
        ${socialBarHTML('r'+route.id)}
      </div>
      <div class="sec-title"><h3>沿途照片 <span style="font-size:12px;color:var(--gray);font-weight:500">· ${route.photoCount} 张</span></h3><span class="more" id="see-all">查看全部</span></div>
      <div class="photo-strip">${photos}</div>
      <div class="detail-cta"><button class="btn-green" id="go-btn" style="width:100%"><span style="width:19px;height:19px;display:inline-block">${ICONS.route}</span>我要出发 · 复制这条路线</button></div>
    </div>
  </div>`);
  p.querySelector('#back').onclick = popPage;
  bindSocial(p);
  let favd = false;
  p.querySelector('#fav').onclick = function(){
    favd = !favd;
    document.getElementById('fav-n').textContent = route.fav + (favd?1:0);
    this.style.color = favd ? 'var(--green2)' : '';
    toast(favd ? '已收藏这条路线' : '已取消收藏');
  };
  p.querySelector('#see-all').onclick = ()=>toast('全部沿途照片（演示）');
  p.querySelectorAll('.strip-item').forEach(s=>s.onclick=()=>{
    const photo = ORIGINAL_PHOTOS.find(x=>x.src===s.dataset.src) || ORIGINAL_PHOTOS[0];
    pushPage(renderWorkDetail({photo, author:'我', time:'沿途拍摄', loc:route.name}));
  });
  p.querySelector('#go-btn').onclick = ()=>toast('已复制路线，去「出发」上传照片吧');
  /* 轨迹描绘动画：白色描边与绿色轨迹同步生长 */
  setTimeout(()=>{
    const paths = p.querySelectorAll('.route-path, .route-casing');
    if(!paths.length) return;
    paths.forEach(path=>{
      const len = path.getTotalLength();
      path.style.strokeDasharray = len;
      path.style.strokeDashoffset = len;
      path.getBoundingClientRect();
      path.style.transition = 'stroke-dashoffset 2.2s cubic-bezier(.4,.6,.3,1)';
      path.style.strokeDashoffset = '0';
    });
  },250);
  return p;
}

let picked = new Set([0,1,2]);
function renderPicker(){
  picked = new Set([0,1,2]);
  const grid = PHOTOS.map((ph,i)=>`
    <div class="picker-item on" data-i="${i}"><img src="${ph.src}"><span class="picker-check"><svg width="12" height="12" viewBox="0 0 12 12"><path d="M2 6.2 4.8 9 10 3.4" stroke="#fff" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"/></svg></span></div>`).join('');
  const p = el(`<div class="page" style="position:absolute;inset:0;z-index:10;background:var(--bg)">
    <div class="detail-header">
      <div class="back-btn" id="back">${ICONS.back}</div>
      <h2>选择照片</h2><span style="width:36px"></span>
    </div>
    <div style="padding:2px 20px;font-size:12.5px;color:var(--gray)">相册（演示数据）· 建议选有地貌特征的风景照</div>
    <div class="picker-grid">${grid}</div>
    <div class="picker-bar">
      <div class="selected-tip">已选择 <b id="pick-n">3</b> 张照片，将一起生成作品</div>
      <button class="btn-green" id="pick-ok" style="width:100%;height:52px;font-size:16.5px">下一步 · 选择成图效果</button>
    </div>
  </div>`);
  p.querySelector('#back').onclick = popPage;
  p.querySelectorAll('.picker-item').forEach(it=>it.onclick=()=>{
    const i = +it.dataset.i;
    if(picked.has(i)){ if(picked.size===1){ toast('至少保留 1 张照片', false); return; } picked.delete(i); it.classList.remove('on'); }
    else { picked.add(i); it.classList.add('on'); }
    document.getElementById('pick-n').textContent = picked.size;
  });
  p.querySelector('#pick-ok').onclick = ()=>pushPage(renderEffects());
  return p;
}

/* 极简坐标：每张照片各有一组地名与经纬度，默认取照片自带的 GPS */
function dmsText(v, isLat){
  const a = Math.abs(v), d = Math.floor(a), m = Math.round((a - d) * 60);
  return `${d}°${('0'+m).slice(-2)}′${isLat ? (v>=0?'N':'S') : (v>=0?'E':'W')}`;
}
function coordOf(ph){
  const k = ph.src;
  if(!S.coords[k]){
    const g = ph.geo || {};
    const provRaw = g.province || (ph.loc||'').split(' · ')[0] || '';
    const prov = provRaw.replace(/(省|市|自治区|特别行政区)$/,'');
    let place = g.place || g.town || g.district || (ph.loc||'').split(' · ').slice(-1)[0] || '';
    if(place.length > 8) place = g.district || g.town || place;   // 太长的地址换成县/乡
    S.coords[k] = {
      name: prov && place ? `${prov} · ${place}` : (place || prov || ''),
      lat: g.lat != null ? dmsText(g.lat, true)  : '',
      lng: g.lng != null ? dmsText(g.lng, false) : ''
    };
  }
  return S.coords[k];
}

  }).join('');
  const editor = c.mode === 'coord' ? `
    <div class="pp-coord-head">
      <span class="k">一张照片一组，红点标在各自的位置</span>

    ${coordCards}` : `

      <textarea id="pp-input" maxlength="120" placeholder="${c.ph}">${curPrompt}</textarea>
      <div class="pp-count"><span id="pp-n">${curPrompt.length}</span>/120</div>
    </div>`;

  const tip = c.mode==='coord' ? '位置为大致范围，非测量精度；原片不做任何改动'

  const p = el(`<div class="page" style="position:absolute;inset:0;z-index:10;background:var(--bg)">

function startGenerate(){
  const isAtlas = S.template === 'china';
  const atlasOne = isAtlas && picked.size === 1;
  S.works = isAtlas
    ? (atlasOne ? [{...PHOTOS[[...picked][0]], atlasSingle:true}] : [ATLAS_COVER])
    : [...picked].map(i=>PHOTOS[i]);
  const isMin = S.template === 'min';
  const tpl = TEMPLATES.find(t=>t.id===S.template) || TEMPLATES[1];
  const mdl = MODELS.find(m=>m.id===S.model) || MODELS[0];
  const userPrompt = S.prompts[S.template] || '';
  const style = S.styleBy[S.template] || '';
  const genMode = S.template==='origin' ? '原始照片无损导出'
    : isMin ? `${mdl.name} · 极简坐标 · ${[...picked].length} 张各标一处`
    : isAtlas ? `${mdl.name} · 手绘舆图 · ${atlasOne ? '1 处' : ATLAS_POINTS.length + ' 处停留'}`
    : `${mdl.name} · ${tpl.name}${style?' · '+style:''}${userPrompt?' · 已按你的描述生成':''}`;
  const gen = el(`<div class="generating" id="gen-overlay">
    <div class="gen-ring">
      <svg width="104" height="104" viewBox="0 0 104 104">
        <circle cx="52" cy="52" r="46" fill="none" stroke="#E7E5DE" stroke-width="7"/>
        <circle id="gen-arc" cx="52" cy="52" r="46" fill="none" stroke="#22A06B" stroke-width="7" stroke-linecap="round" stroke-dasharray="289" stroke-dashoffset="289"/>
      </svg>
      <div class="pct"><div class="gen-num"><span id="gen-pct">0</span><small>%</small></div></div>
    </div>
    <div class="gen-title">${isAtlas?(atlasOne?'正在为这一处落笔…':'正在铺展这一年的行程…'):(isMin?'正在叠加地理线稿…':(S.template==='origin'?'正在准备原图…':'AI 正在读懂山野…'))}</div>
    <div class="gen-mode">${genMode}</div>
    <div class="gen-steps">
      ${(isAtlas?(atlasOne?['读出这张照片的拍摄地','把这一处落到宣纸上','画山、引水、点朱砂','题字落款']:['读出行程里的每一处停留','按方位铺到宣纸上','画山、引水、点朱砂','题字落款'])
        : isMin?['读取照片与拍摄地','提取真实地图要素','简化透明地图线稿','原片无损合成']
        : S.template==='origin' ? ['读取原始照片','无损解码原片','套用原图呈现','导出高清原图']
        : ['上传照片到云端','AI 读懂地貌与光线','按提示词绘制'+tpl.name,'合成你的专属成图'])
        .map((t,i)=>`<div class="gen-step" data-p="${i}"><span class="dot"></span>${t}</div>`).join('')}
    </div>
  </div>`);
  screen.appendChild(gen);
  /* 生成遮罩也占一层：生成中点返回不会误退到上一页 */
  layerPush({el:gen, close:()=>{ toast('正在生成，稍等一下'); }});
  const arc = gen.querySelector('#gen-arc'), pct = gen.querySelector('#gen-pct');
  const steps = gen.querySelectorAll('.gen-step');
  let prog = 0, cur = 0;
  const iv = setInterval(()=>{
    prog += Math.random()*4+2.2;
    if(prog>100) prog=100;
    arc.style.strokeDashoffset = 289 - 289*prog/100;
    pct.textContent = Math.floor(prog);
    const stage = Math.min(3, Math.floor(prog/26));
    if(stage!==cur){ cur=stage; }
    steps.forEach((s,i)=>{
      s.classList.toggle('done', prog >= (i+1)*26);
      s.classList.toggle('active', !s.classList.contains('done') && i===Math.min(3, Math.floor(prog/26)));
    });
    if(prog>=100){
      clearInterval(iv);
      steps.forEach(s=>{s.classList.add('done');s.classList.remove('active')});
      setTimeout(()=>{
        gen.style.opacity='0'; gen.style.transition='opacity .35s';
        setTimeout(()=>{
          layerSilentClose(gen);      /* 遮罩并入结果页这一层，返回时一次到位 */
          if(gen.parentNode) gen.remove();
          pushPage(renderResult(0));
        },360);
      },420);
    }
  },110);
}

/* 一条起伏的山脊，从 x0→x1 收在 baseY 上方 */
/* 三组频率叠加：宽峰、窄谷、细起伏，避免规则锯齿 */
function atlasRidge(x0, x1, baseY, amp, seed, n){
  const pts = [];
  for(let i=0;i<=n;i++){
    const t = i/n, x = x0 + (x1-x0)*t;
    const a = Math.pow(Math.abs(Math.sin((t*2.6 + seed)*Math.PI)), 0.52);
    const b = Math.pow(Math.abs(Math.sin((t*5.9 + seed*1.9)*Math.PI)), 1.8) * 0.62;
    const c = Math.abs(Math.sin((t*13.7 + seed*2.7)*Math.PI)) * 0.14;
    pts.push([x, baseY - amp*(a*0.74 + b + c)]);
  }
  return pts;
}
function atlasBand(x0, x1, baseY, amp, seed, n, layers){
  const L = layers || 2;
  let out = '';
  for(let k=0;k<L;k++){
    const pts = atlasRidge(x0, x1, baseY + k*15, amp*(1 - k*0.34), seed + k*2.3, n);
    const d = 'M' + pts.map(p=>`${p[0].toFixed(1)},${p[1].toFixed(1)}`).join(' L ')
      + ` L ${x1},624 L ${x0},624 Z`;
    const fill = k===0 ? 'var(--at-m1)' : (k===1 ? 'var(--at-m2)' : 'var(--at-m3)');
    const op = k===0 ? .38 : (k===1 ? .60 : .84);
    out += `<path class="at-m" d="${d}" fill="${fill}" opacity="${op}"/>`;
  }
  return out;
}
function atlasTrees(x0, x1, y0, y1, seed, count){
  let out = '';
  for(let i=0;i<count;i++){
    const t = ((i*37 + seed*11) % 100)/100;
    const u = ((i*61 + seed*7) % 100)/100;
    const x = x0 + (x1-x0)*t, y = y0 + (y1-y0)*u;
    const s = 2.2 + ((i*13)%7)/7 * 1.4;
    out += `<path d="M${x.toFixed(1)},${(y-s*2.2).toFixed(1)} L${(x-s).toFixed(1)},${y.toFixed(1)} L${(x+s).toFixed(1)},${y.toFixed(1)} Z" fill="var(--at-tree)" opacity=".7"/>`;
  }
  return out;
}
/* 单张照片：在这一张舆图上只落一处，点位按照片名稳定抖动，避免张张一样 */
function atlasSoloPoint(photo){
  const k = (photo.name || '') + (photo.src || '');
  let h = 5;
  for(let i=0;i<k.length;i++) h = (h*31 + k.charCodeAt(i)) % 9973;
  return { x: 148 + (h % 112), y: 286 + (Math.floor(h/7) % 76) };
}

      return `<g class="anno-shape" data-i="${i}" style="opacity:0;transition:opacity .4s"><line x1="${x1}" y1="${y1}" x2="${x2}" y2="${y2}" stroke="${a.color}" stroke-width="0.7" vector-effect="non-scaling-stroke" stroke-linecap="round"/><circle cx="${x2}" cy="${y2}" r="0.9" fill="${a.color}"/></g>`;

      <div class="photo-fit" style="opacity:0;transition:opacity .45s">

        <span class="s-icon"><span style="width:17px;height:17px;color:#fff;display:block">${ICONS.mountain}</span></span>

  p.querySelectorAll('.result-thumb').forEach(t=>t.onclick=()=>{ replacePage(renderResult(+t.dataset.i)); });
  p.querySelector('#save-btn').onclick = ()=>{
    if(!S.saved.includes(photo)){ S.saved.push(photo); S.stats.photos += 1;
      S.recent.unshift({name:photo.name, meta:'1 张照片 · 刚刚', photo});
      toast('已存入我的图鉴'); } else toast('这张已在图鉴里');
  };
  p.querySelector('#share-btn').onclick = ()=>openPoster(photo, artOf(photo));
  p.querySelector('#pub-btn').onclick = ()=>openPublish(photo, artOf(photo));
  const rw = p.querySelector('.result-photo-wrap');
  setTimeout(()=>fitPhoto(rw), 30);
  setTimeout(()=>fitPhoto(rw), 300);
  const pf = p.querySelector('.photo-fit');
  const zimg = p.querySelector(isAb ? '.ab-base, .cl-cut img' : (isPc ? '.pc-photo img' : '.photo-fit > img'));
  if(zimg) zimg.onclick = ()=>openZoom(photo.src, photo.name + ' · ' + tpl.name);
  if(!isMin && !isSheet) bindAnnoChips(pf);
  setTimeout(()=>{ if(pf) pf.style.opacity='1'; }, 40);
  setTimeout(()=>layoutAnnoChips(pf), 380);   // 等淡入与图片尺寸稳定后再排一次

  if(isMin){
    /* 地图淡入后落下唯一的拍摄地红点，不添加额外装饰动画 */
    setTimeout(()=>{ p.querySelectorAll('.min-dot').forEach(d=>d.classList.add('on')); }, 720);
  }
  /* 标注依次浮现 */
  setTimeout(()=>{
    const chipsEls = p.querySelectorAll('.anno-chip'), shapes = p.querySelectorAll('.anno-shape');
    chipsEls.forEach((c,i)=>setTimeout(()=>{
      c.classList.add('show');
      shapes.forEach(s=>{ if(+s.dataset.i===i) s.style.opacity='1'; });
    }, 450 + i*620));
    const sumEl = p.querySelector('#summary');
    setTimeout(()=>{ if(sumEl) sumEl.classList.add('show'); }, 450 + chipsEls.length*620 + 150);
  },300);
  return p;
}

  };

function sheetFor(art, photo){
  if(!art) return '';

/* 横向翻图：鼠标拖拽 + 滚轮 + 左右键（触摸走原生横向滚动） */
function bindSwipeTrack(track, opts){
  if(!track) return;
  opts = opts || {};
  const pageW = ()=> track.clientWidth || 1;
  const curIdx = ()=> Math.round(track.scrollLeft / pageW());
  const snapTo = (i)=>{
    const w = pageW();
    const n = track.children.length;
    const t = Math.max(0, Math.min(n - 1, i)) * w;
    track.scrollTo({left:t, behavior:'smooth'});
    /* 兜底：部分环境（无头/禁用动画）平滑滚动不推进，强制落位 */
    setTimeout(()=>{ if(Math.abs(track.scrollLeft - t) > 2) track.scrollLeft = t; }, 420);
  };
  let dragging = false, startX = 0, startScroll = 0, moved = false, pid = null;

  track.addEventListener('pointerdown', e=>{
    if(e.pointerType === 'touch') return;      // 触摸交给原生横向滚动
    dragging = true; moved = false; pid = e.pointerId;
    startX = e.clientX; startScroll = track.scrollLeft;
    track.style.scrollSnapType = 'none';
    track.style.cursor = 'grabbing';
    try{ track.setPointerCapture(pid); }catch(_){}
  });
  track.addEventListener('pointermove', e=>{
    if(!dragging) return;
    const dx = e.clientX - startX;
    if(Math.abs(dx) > 4) moved = true;
    track.scrollLeft = startScroll - dx;
    if(moved) e.preventDefault();
  });
  const finish = ()=>{
    if(!dragging) return;
    dragging = false;
    track.style.scrollSnapType = '';
    track.style.cursor = '';
    snapTo(curIdx());
  };
  track.addEventListener('pointerup', finish);
  track.addEventListener('pointercancel', finish);
  /* 拖拽结束后不要误触卡片点击 */
  track.addEventListener('click', e=>{
    if(moved){ e.stopPropagation(); e.preventDefault(); moved = false; }
  }, true);

  if(opts.wheel){
    let wt = null;
    track.addEventListener('wheel', e=>{
      if(Math.abs(e.deltaY) <= Math.abs(e.deltaX)) return;
      e.preventDefault();
      track.style.scrollSnapType = 'none';
      track.scrollLeft += e.deltaY;
      clearTimeout(wt);
      wt = setTimeout(()=>{ track.style.scrollSnapType = ''; snapTo(curIdx()); }, 130);
    }, {passive:false});
  }
  if(opts.prev) opts.prev.onclick = ()=>snapTo(curIdx() - 1);
  if(opts.next) opts.next.onclick = ()=>snapTo(curIdx() + 1);
  return {snapTo, curIdx};
}

/* 绑定卡片点击 → 作品详情；多图帖进全屏右滑浏览 */
function bindFeedCards(root){
  root.querySelectorAll('.feed-multi .fm-track').forEach(tr=>{
    const sync = ()=>{

      const i = Math.min(total, Math.round(tr.scrollLeft / Math.max(1,tr.clientWidth)) + 1);
      const c = tr.parentElement.querySelector('.fm-count');
      if(c) c.textContent = i + '/' + total;
    };
    tr.addEventListener('scroll', sync, {passive:true});
    bindSwipeTrack(tr);
    sync();
  });
  root.querySelectorAll('.feed-item').forEach(c=>c.onclick=()=>{
    const f = feedData().find(x=>x.photo.name===c.dataset.name);

  bindSocial(root);

/* 多图帖全屏浏览：左右滑动翻图 */

        <div class="fv-count" id="fv-count">1 / ${imgs.length}</div>
      </div>
    </div>
  </div>`);
  const tr = p.querySelector('#fv-track');
  const cnt = p.querySelector('#fv-count');
  const hint = p.querySelector('#fv-hint');
  bindSwipeTrack(tr, {wheel:true, prev:p.querySelector('#fv-prev'), next:p.querySelector('#fv-next')});
  tr.addEventListener('scroll', ()=>{
    const total = tr.children.length;
    const i = Math.min(total, Math.round(tr.scrollLeft / Math.max(1,tr.clientWidth)) + 1);

  let tsx = 0, tsy = 0, tmoved = false;
  tr.addEventListener('touchstart', e=>{
    if(e.touches.length === 1){ tsx = e.touches[0].clientX; tsy = e.touches[0].clientY; tmoved = false; }
  }, {passive:true});
  tr.addEventListener('touchmove', e=>{
    if(e.touches.length === 1 && (Math.abs(e.touches[0].clientX - tsx) > 8 || Math.abs(e.touches[0].clientY - tsy) > 8)) tmoved = true;
  }, {passive:true});
  p.querySelectorAll('.fv-slide img').forEach((im,i)=>{
    im.onclick = ()=>{ if(tmoved){ tmoved = false; return; } openZoom(im.getAttribute('src'), f.photo.name + ' · ' + (i+1) + '/' + imgs.length); };
  });
  return p;
}

  screen.appendChild(m);

}
function doCloseMask(m){ m.classList.remove('show'); setTimeout(()=>{ if(m.parentNode) m.remove(); },340); }
/* 弹层也进返回栈：手机返回键先关弹层，再退页面 */
function openMaskLayer(m){
  layerPush({el:m, close:()=>doCloseMask(m)});
  requestAnimationFrame(()=>m.classList.add('show'));
}
function closeMask(m){
  const i = LAYERS.findIndex(l=>l.el === m);
  if(i >= 0){ goBack(LAYERS.length - i); return; }
  doCloseMask(m);
}
